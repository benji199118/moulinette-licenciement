<!DOCTYPE html>
<html x-data="app()" :dir="lang==='ar'?'rtl':'ltr'" :lang="lang" :class="darkMode ? 'dark' : ''" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moulinette Licenciement | المغرب — Loi 65-99</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Supabase CDN — doit charger AVANT auth.js et Alpine -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script defer src="https://unpkg.com/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
/* ════════════════════════════════════════════════════════════════
   MOULINETTE — DESIGN SYSTEM
   Palette: warm cream + deep ink + moroccan green + ochre accent
   Typography: Instrument Serif (display) + Inter Tight (body) + JetBrains Mono (num)
   ════════════════════════════════════════════════════════════════ */

:root {
  /* Surfaces */
  --ml-bg:         #f6f3ec;
  --ml-bg-2:       #efebe1;
  --ml-card:       #ffffff;

  /* Ink hierarchy */
  --ml-ink:        #0d0f0e;
  --ml-ink-2:      #2c302e;
  --ml-ink-mute:   #6b6f6c;
  --ml-ink-faint:  #9b9e9a;

  /* Lines */
  --ml-line:        rgba(13, 15, 14, 0.10);
  --ml-line-strong: rgba(13, 15, 14, 0.18);

  /* Accents */
  --ml-green:      #0f4d3a;
  --ml-green-2:    #1a6b51;
  --ml-green-soft: #dce8e0;
  --ml-ochre:      #c97a26;
  --ml-ochre-soft: #f1deb8;
  --ml-rouge:      #b6402a;
  --ml-rouge-soft: #f4d8d2;

  /* Radius */
  --r-sm: 8px;
  --r:    14px;
  --r-lg: 22px;

  /* Shadow */
  --sh-sm: 0 1px 2px rgba(13,15,14,.05), 0 0 0 1px rgba(13,15,14,.04);
  --sh:    0 1px 2px rgba(13,15,14,.04), 0 8px 24px -8px rgba(13,15,14,.12), 0 0 0 1px rgba(13,15,14,.05);
  --sh-lg: 0 1px 2px rgba(13,15,14,.04), 0 24px 60px -20px rgba(13,15,14,.25), 0 0 0 1px rgba(13,15,14,.05);

  /* Fonts — Modern Swiss */
  --f-serif: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; /* utilisé pour display, italic = emphase */
  --f-sans:  "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-mono:  "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-ar:    "IBM Plex Sans Arabic", "Noto Sans Arabic", system-ui, sans-serif;
}

/* ── Dark mode override ────────────────────────────────────────── */
.dark {
  --ml-bg:         #0d0f0e;
  --ml-bg-2:       #141716;
  --ml-card:       #181b19;
  --ml-ink:        #f6f3ec;
  --ml-ink-2:      #d6d3cc;
  --ml-ink-mute:   #9a9d98;
  --ml-ink-faint:  #6b6f6c;
  --ml-line:        rgba(246, 243, 236, 0.10);
  --ml-line-strong: rgba(246, 243, 236, 0.20);
  --ml-green:      #4ade80;
  --ml-green-2:    #22c55e;
  --ml-green-soft: rgba(74,222,128,0.14);
  --ml-ochre:      #f5b16a;
  --ml-ochre-soft: rgba(245,177,106,0.16);
  --ml-rouge:      #f87171;
  --ml-rouge-soft: rgba(248,113,113,0.14);
}

/* ── Resets ────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
[x-cloak] { display: none !important; }
html { scroll-behavior: smooth; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ml-bg);
  color: var(--ml-ink);
  font-family: var(--f-sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  transition: background .3s, color .3s;
}
[lang="ar"] body, [lang="ar"] * { font-family: var(--f-ar); }
[lang="ar"] .ml-mono, [lang="ar"] .ml-num { font-family: var(--f-mono); }
[lang="ar"] .ml-serif { font-family: var(--f-ar); }

a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
img, svg { display: block; max-width: 100%; }

/* ── Layout ────────────────────────────────────────────────────── */
.ml-wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
@media (max-width: 720px) { .ml-wrap { padding: 0 20px; } }

/* ── Typography ────────────────────────────────────────────────── */
.ml-eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ml-ink-mute);
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.ml-eyebrow::before {
  content: "";
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ml-green);
}
.ml-display {
  font-family: var(--f-sans);
  font-weight: 600;
  font-size: clamp(36px, 5.4vw, 68px);
  line-height: 1.02;
  letter-spacing: -0.035em;
  margin: 0;
  color: var(--ml-ink);
}
.ml-display em { font-style: italic; font-weight: 500; color: var(--ml-green); }
.ml-h2 {
  font-family: var(--f-sans);
  font-weight: 600;
  font-size: clamp(26px, 3.4vw, 42px);
  line-height: 1.1;
  letter-spacing: -0.028em;
  margin: 0;
  color: var(--ml-ink);
}
.ml-h2 em { font-style: italic; font-weight: 500; color: var(--ml-green); }
.ml-h3 {
  font-family: var(--f-sans);
  font-weight: 500;
  font-size: 19px;
  letter-spacing: -0.01em;
  margin: 0;
  color: var(--ml-ink);
}
.ml-lead {
  font-size: 17px;
  line-height: 1.55;
  color: var(--ml-ink-2);
  margin: 0;
  max-width: 60ch;
}
.ml-mono { font-family: var(--f-mono); font-feature-settings: "tnum"; }
.ml-num { font-variant-numeric: tabular-nums; }
.ml-mute { color: var(--ml-ink-mute); }
.ml-faint { color: var(--ml-ink-faint); }
.ml-serif { font-family: var(--f-serif); }

/* ── Buttons ───────────────────────────────────────────────────── */
.ml-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  height: 44px;
  padding: 0 18px;
  border-radius: 999px;
  border: 1px solid var(--ml-line-strong);
  background: var(--ml-card);
  color: var(--ml-ink);
  font-weight: 500;
  font-size: 14.5px;
  letter-spacing: -0.005em;
  transition: transform .15s ease, background .15s ease, border-color .15s ease, color .15s, box-shadow .15s;
  text-align: center;
  white-space: nowrap;
}
.ml-btn:hover { transform: translateY(-1px); border-color: var(--ml-ink); }
.ml-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.ml-btn--primary {
  background: var(--ml-ink);
  color: var(--ml-bg);
  border-color: var(--ml-ink);
}
.ml-btn--primary:hover { background: var(--ml-green); border-color: var(--ml-green); color: #f6f3ec; }
.ml-btn--accent {
  background: var(--ml-green);
  color: #f6f3ec;
  border-color: var(--ml-green);
}
.ml-btn--accent:hover { background: var(--ml-green-2); border-color: var(--ml-green-2); }
.ml-btn--ghost { background: transparent; border-color: transparent; }
.ml-btn--ghost:hover { background: var(--ml-bg-2); border-color: transparent; transform: none; }
.ml-btn--lg { height: 52px; padding: 0 22px; font-size: 15.5px; }
.ml-btn--sm { height: 34px; padding: 0 14px; font-size: 13px; }
.ml-btn--icon { height: 38px; width: 38px; padding: 0; border-radius: 999px; }
.ml-btn--block { width: 100%; }

.ml-arrow { display: inline-block; transition: transform .2s ease; }
.ml-btn:hover .ml-arrow { transform: translateX(3px); }
[dir="rtl"] .ml-btn:hover .ml-arrow { transform: translateX(-3px); }

/* ── Chip / Badge ──────────────────────────────────────────────── */
.ml-chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  background: var(--ml-card);
  border: 1px solid var(--ml-line);
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ml-ink-2);
  white-space: nowrap;
}
.ml-chip--green { background: var(--ml-green-soft); border-color: transparent; color: var(--ml-green); }
.ml-chip--ochre { background: var(--ml-ochre-soft); border-color: transparent; color: #6b4515; }
.dark .ml-chip--ochre { color: var(--ml-ochre); }
.ml-chip--rouge { background: var(--ml-rouge-soft); border-color: transparent; color: var(--ml-rouge); }
.ml-chip--ink   { background: var(--ml-ink); border-color: transparent; color: var(--ml-bg); }
.ml-chip__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.7; }
[lang="ar"] .ml-chip { font-family: var(--f-ar); letter-spacing: 0; text-transform: none; font-size: 12px; }

/* ── Nav ───────────────────────────────────────────────────────── */
.ml-nav {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  background: color-mix(in srgb, var(--ml-bg) 80%, transparent);
  border-bottom: 1px solid var(--ml-line);
}
.ml-nav__inner {
  display: flex; align-items: center; gap: 24px;
  padding: 14px 0;
}
.ml-logo {
  display: inline-flex; align-items: center; gap: 10px;
  font-weight: 500; letter-spacing: -0.02em;
  font-size: 16px;
  color: var(--ml-ink);
}
.ml-logo__mark {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: var(--ml-ink); color: var(--ml-bg);
  display: grid; place-items: center;
  font-family: var(--f-sans);
  font-weight: 700; font-size: 14px; line-height: 1;
  letter-spacing: -0.02em;
}
.ml-logo__sub { color: var(--ml-ink-mute); font-weight: 400; font-size: 12px; }
.ml-nav__spacer { flex: 1; }
.ml-nav__right { display: flex; align-items: center; gap: 8px; }

/* Language toggle */
.ml-lang {
  display: inline-flex; align-items: center;
  border: 1px solid var(--ml-line-strong);
  border-radius: 999px;
  padding: 3px;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
}
.ml-lang button {
  border: 0; background: transparent; color: var(--ml-ink-mute);
  padding: 5px 12px; border-radius: 999px; cursor: pointer;
  transition: all .15s;
  font-family: var(--f-mono);
}
.ml-lang button.is-active { background: var(--ml-ink); color: var(--ml-bg); }
.ml-lang button[lang="ar"] { font-family: var(--f-ar); font-size: 13px; letter-spacing: 0; }

/* Theme toggle */
.ml-theme {
  width: 38px; height: 38px;
  border-radius: 999px;
  border: 1px solid var(--ml-line-strong);
  background: var(--ml-card);
  color: var(--ml-ink);
  display: grid; place-items: center;
  cursor: pointer;
  transition: all .15s;
  font-size: 15px;
}
.ml-theme:hover { border-color: var(--ml-ink); }

/* User pill */
.ml-user-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 10px 4px 4px;
  border-radius: 999px;
  border: 1px solid var(--ml-line-strong);
  background: var(--ml-card);
}
.ml-user-pill__avatar {
  width: 28px; height: 28px;
  border-radius: 999px;
  background: var(--ml-green);
  color: #f6f3ec;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 600;
  flex-shrink: 0;
}
.ml-user-pill__email {
  font-size: 11.5px;
  color: var(--ml-ink-mute);
  letter-spacing: 0;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
@media (max-width: 640px) { .ml-user-pill__email { display: none; } }
.ml-user-pill__logout {
  background: none;
  border: none;
  width: 24px; height: 24px;
  border-radius: 999px;
  display: grid; place-items: center;
  cursor: pointer;
  color: var(--ml-ink-faint);
  font-size: 11px;
  font-family: var(--f-sans);
  font-weight: 600;
  letter-spacing: -0.01em;
  transition: background .15s, color .15s;
  flex-shrink: 0;
  line-height: 1;
}
.ml-user-pill__logout:hover {
  background: var(--ml-rouge-soft);
  color: var(--ml-rouge);
}

/* Tabs */
.ml-tabs {
  display: flex; gap: 4px;
  padding: 10px 0 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.ml-tabs::-webkit-scrollbar { display: none; }
.ml-tab {
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13.5px; font-weight: 500;
  color: var(--ml-ink-mute);
  background: transparent;
  border: 1px solid transparent;
  cursor: pointer; transition: all .15s;
  white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.ml-tab:hover { color: var(--ml-ink); background: var(--ml-bg-2); }
.ml-tab.is-active { background: var(--ml-ink); color: var(--ml-bg); }
.ml-tab__icon { font-size: 14px; }

/* ── Cards ─────────────────────────────────────────────────────── */
.ml-card {
  background: var(--ml-card);
  border-radius: var(--r);
  box-shadow: var(--sh-sm);
  padding: 24px;
  transition: box-shadow .2s, transform .2s, border-color .15s;
}
.ml-card--lg { padding: 32px; }
.ml-card--xl { padding: 40px; }
.ml-card--bordered { box-shadow: none; border: 1px solid var(--ml-line); }
.ml-card--hover:hover { box-shadow: var(--sh); transform: translateY(-2px); }
.ml-card--ink { background: var(--ml-ink); color: var(--ml-bg); }
.ml-card--ink .ml-mute { color: rgba(246,243,236,0.65); }

/* ── Wizard progress ───────────────────────────────────────────── */
.ml-progress {
  display: flex; align-items: center; gap: 0;
  max-width: 480px; margin: 0 auto 40px;
}
.ml-progress__step {
  width: 32px; height: 32px;
  border-radius: 999px;
  display: grid; place-items: center;
  font-family: var(--f-mono);
  font-size: 12px; font-weight: 500;
  background: var(--ml-bg-2);
  color: var(--ml-ink-faint);
  border: 1px solid var(--ml-line);
  flex-shrink: 0;
  transition: all .25s;
}
.ml-progress__step.is-current { background: var(--ml-ink); color: var(--ml-bg); border-color: var(--ml-ink); }
.ml-progress__step.is-done    { background: var(--ml-green); color: #f6f3ec; border-color: var(--ml-green); }
.ml-progress__line {
  flex: 1; height: 1px;
  background: var(--ml-line-strong);
  transition: background .25s;
}
.ml-progress__line.is-done { background: var(--ml-green); }

/* ── Step option (wizard choice cards) ─────────────────────────── */
.ml-option {
  background: var(--ml-card);
  border: 1px solid var(--ml-line-strong);
  border-radius: var(--r);
  padding: 20px;
  cursor: pointer;
  transition: all .15s;
  text-align: start;
  width: 100%;
  font-family: inherit;
  color: inherit;
  display: flex; flex-direction: column; gap: 10px;
}
.ml-option:hover { border-color: var(--ml-ink); transform: translateY(-1px); }
.ml-option.is-selected {
  border-color: var(--ml-green);
  background: var(--ml-green-soft);
  box-shadow: var(--sh-sm);
}
.ml-option__icon {
  width: 36px; height: 36px;
  border-radius: 9px;
  background: var(--ml-bg-2);
  display: grid; place-items: center;
  font-size: 18px;
  flex-shrink: 0;
}
.ml-option.is-selected .ml-option__icon { background: var(--ml-card); }
.ml-option__label { font-size: 15px; font-weight: 500; color: var(--ml-ink); }
.ml-option__desc  { font-size: 12.5px; color: var(--ml-ink-mute); line-height: 1.45; }

/* ── Forms ─────────────────────────────────────────────────────── */
.ml-field { display: flex; flex-direction: column; gap: 6px; }
.ml-field__label {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--ml-ink-mute);
}
[lang="ar"] .ml-field__label { font-family: var(--f-ar); letter-spacing: 0; text-transform: none; font-size: 12px; }
.ml-input {
  padding: 12px 14px;
  border: 1px solid var(--ml-line-strong);
  border-radius: var(--r-sm);
  font-size: 15px;
  color: var(--ml-ink);
  background: var(--ml-bg);
  width: 100%;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  font-family: inherit;
}
.ml-input:focus { border-color: var(--ml-green); box-shadow: 0 0 0 3px rgba(15,77,58,0.12); }
.ml-input--center { text-align: center; font-weight: 500; }
.ml-input--lg { font-size: 22px; padding: 16px; font-weight: 600; letter-spacing: -0.02em; }
.ml-input--accent {
  background: var(--ml-green-soft); color: var(--ml-green);
  border-color: transparent; font-weight: 500;
}

/* Range slider */
.ml-range {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px;
  border-radius: 999px;
  background: var(--ml-line-strong);
  outline: none;
}
.ml-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px;
  border-radius: 999px;
  background: var(--ml-ink);
  cursor: pointer;
  transition: transform .15s;
}
.ml-range::-webkit-slider-thumb:hover { transform: scale(1.1); }
.ml-range::-moz-range-thumb {
  width: 20px; height: 20px;
  border-radius: 999px;
  background: var(--ml-ink);
  cursor: pointer; border: none;
}

/* ── Result: amount lines ──────────────────────────────────────── */
.ml-amount {
  display: grid; grid-template-columns: 1fr auto;
  gap: 16px; align-items: center;
  padding: 18px 22px;
  border-radius: var(--r);
  background: var(--ml-card);
  box-shadow: var(--sh-sm);
}
.ml-amount__label { font-size: 15px; color: var(--ml-ink); font-weight: 500; }
.ml-amount__sub   { font-size: 12.5px; color: var(--ml-ink-mute); margin-top: 3px; }
.ml-amount__formula {
  font-family: var(--f-mono);
  font-size: 11.5px;
  color: var(--ml-ink-faint);
  margin-top: 6px;
}
[lang="ar"] .ml-amount__formula { font-family: var(--f-mono); }
.ml-amount__value {
  font-family: var(--f-mono);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.015em;
  color: var(--ml-ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.ml-amount__value--accent { color: var(--ml-green); }
.ml-amount__value--blue   { color: #2563eb; }
.ml-amount__value--rouge  { color: var(--ml-rouge); }
.ml-amount__value--ochre  { color: #8b5a14; }
.dark .ml-amount__value--ochre { color: var(--ml-ochre); }
.ml-amount__icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--ml-bg-2);
  display: grid; place-items: center;
  font-size: 14px;
  flex-shrink: 0;
}

.ml-breakdown {
  margin-top: 12px;
  padding: 14px 16px;
  background: var(--ml-bg);
  border-radius: var(--r-sm);
  display: flex; flex-direction: column; gap: 10px;
}
.ml-breakdown__row {
  display: flex; flex-direction: column; gap: 2px;
}
.ml-breakdown__main {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12.5px;
}
.ml-breakdown__label { color: var(--ml-ink-2); font-weight: 500; }
.ml-breakdown__amount { font-family: var(--f-mono); color: var(--ml-ink); }
.ml-breakdown__formula {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ml-ink-faint);
}
.ml-breakdown__head {
  padding-bottom: 8px;
  margin-bottom: 4px;
  border-bottom: 1px dashed var(--ml-line-strong);
  display: flex; align-items: center; gap: 8px;
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ml-ink-mute);
}
[lang="ar"] .ml-breakdown__head { font-family: var(--f-ar); letter-spacing: 0; text-transform: none; font-size: 12px; }

/* Total card (hero) */
.ml-total {
  background: var(--ml-ink);
  color: var(--ml-bg);
  border-radius: var(--r-lg);
  padding: 36px 40px;
  display: flex; flex-direction: column; gap: 8px;
  box-shadow: var(--sh-lg);
}
.ml-total__small {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(246,243,236,0.55);
}
[lang="ar"] .ml-total__small { font-family: var(--f-ar); letter-spacing: 0; text-transform: none; font-size: 13px; }
.ml-total__amount {
  font-family: var(--f-sans);
  font-weight: 600;
  font-size: clamp(48px, 8vw, 80px);
  line-height: 1;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
}
.ml-total__currency {
  font-family: var(--f-mono);
  font-size: 18px;
  color: rgba(246,243,236,0.65);
  margin-left: 8px;
  vertical-align: middle;
}
.ml-total__tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.ml-total__tag {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 5px 11px;
  border-radius: 999px;
  background: rgba(246,243,236,0.10);
  color: rgba(246,243,236,0.85);
}
[lang="ar"] .ml-total__tag { font-family: var(--f-ar); letter-spacing: 0; text-transform: none; font-size: 13px; }

/* ── Timeline (dates tab) ──────────────────────────────────────── */
.ml-timeline { display: flex; flex-direction: column; gap: 0; }
.ml-tl-step {
  display: grid; grid-template-columns: 56px 1fr; gap: 0;
  padding: 0;
  position: relative;
}
.ml-tl-step__col {
  display: flex; flex-direction: column; align-items: center;
  padding-top: 2px;
}
.ml-tl-step__dot {
  width: 36px; height: 36px;
  border-radius: 999px;
  background: var(--ml-bg-2);
  display: grid; place-items: center;
  font-size: 14px;
  border: 1px solid var(--ml-line);
  flex-shrink: 0;
}
.ml-tl-step__line {
  width: 1px; flex: 1;
  background: var(--ml-line-strong);
  min-height: 28px;
  margin: 6px 0;
}
.ml-tl-step:last-child .ml-tl-step__line { display: none; }
.ml-tl-step__body { padding: 4px 0 24px; }
.ml-tl-step__label {
  font-size: 14px;
  color: var(--ml-ink);
  font-weight: 500;
  margin-bottom: 4px;
}
.ml-tl-step__date {
  font-family: var(--f-sans);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: -0.02em;
  color: var(--ml-ink);
  margin-bottom: 8px;
}
.ml-tl-step--highlight .ml-tl-step__dot {
  background: var(--ml-green-soft);
  border-color: var(--ml-green);
}
.ml-tl-step--highlight .ml-tl-step__date { color: var(--ml-green); }
.ml-tl-step__badge {
  display: inline-flex;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid;
}
.ml-tl-step__badge--ok    { background: var(--ml-green-soft);  color: var(--ml-green);  border-color: transparent; }
.ml-tl-step__badge--warn  { background: var(--ml-ochre-soft);  color: #6b4515; border-color: transparent; }
.dark .ml-tl-step__badge--warn { color: var(--ml-ochre); }
.ml-tl-step__badge--danger{ background: var(--ml-rouge-soft);  color: var(--ml-rouge);  border-color: transparent; }
[lang="ar"] .ml-tl-step__badge { font-family: var(--f-ar); letter-spacing: 0; }

/* ── Refs (legal articles) ─────────────────────────────────────── */
.ml-ref {
  border: 1px solid var(--ml-line);
  border-radius: var(--r);
  overflow: hidden;
  background: var(--ml-card);
  transition: border-color .15s;
}
.ml-ref:hover { border-color: var(--ml-line-strong); }
.ml-ref__head {
  width: 100%;
  padding: 18px 22px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: transparent; border: 0;
  text-align: start;
}
.ml-ref__art {
  font-family: var(--f-mono);
  font-size: 11.5px;
  padding: 4px 10px;
  background: var(--ml-green-soft);
  color: var(--ml-green);
  border-radius: 999px;
  white-space: nowrap;
}
.ml-ref__title { flex: 1; font-size: 14.5px; font-weight: 500; color: var(--ml-ink); }
.ml-ref__chev { color: var(--ml-ink-mute); transition: transform .25s; }
.ml-ref.is-open .ml-ref__chev { transform: rotate(180deg); }
.ml-ref__body {
  padding: 0 22px 20px;
  border-top: 1px dashed var(--ml-line-strong);
  padding-top: 16px;
  color: var(--ml-ink-2);
  font-size: 14.5px;
  line-height: 1.6;
}

/* ── Types cards ───────────────────────────────────────────────── */
.ml-type {
  background: var(--ml-card);
  border-radius: var(--r);
  padding: 24px;
  box-shadow: var(--sh-sm);
  display: flex; flex-direction: column; gap: 14px;
  border-top: 3px solid;
}
.ml-type__head { display: flex; align-items: start; gap: 12px; }
.ml-type__icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  display: grid; place-items: center;
  font-size: 18px;
  flex-shrink: 0;
}
.ml-type__title { font-family: var(--f-sans); font-weight: 600; font-size: 19px; line-height: 1.15; letter-spacing: -0.025em; color: var(--ml-ink); }
.ml-type__desc { color: var(--ml-ink-mute); font-size: 14px; }
.ml-type__list { display: flex; flex-direction: column; gap: 8px; padding: 0; margin: 0; list-style: none; }
.ml-type__list li { display: flex; align-items: start; gap: 10px; font-size: 13.5px; color: var(--ml-ink-2); }
.ml-type__list li::before {
  content: "✓";
  color: var(--ml-green); font-weight: 600; flex-shrink: 0;
}
.ml-type__warning {
  padding: 10px 14px;
  background: var(--ml-rouge-soft);
  color: var(--ml-rouge);
  border-radius: 8px;
  font-size: 12.5px;
}
.ml-type__ref {
  padding-top: 12px;
  border-top: 1px dashed var(--ml-line);
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ml-ink-mute);
}
[lang="ar"] .ml-type__ref { font-family: var(--f-ar); }

/* ── Procedure steps ───────────────────────────────────────────── */
.ml-proc-step {
  background: var(--ml-card);
  border-radius: var(--r);
  padding: 22px 24px;
  box-shadow: var(--sh-sm);
  display: grid; grid-template-columns: 48px 1fr; gap: 18px;
}
.ml-proc-step__num {
  width: 36px; height: 36px;
  border-radius: 999px;
  background: var(--ml-ink); color: var(--ml-bg);
  display: grid; place-items: center;
  font-family: var(--f-mono);
  font-weight: 500;
  font-size: 14px;
}
.ml-proc-step__title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.ml-proc-step__title h4 { font-size: 16px; font-weight: 500; color: var(--ml-ink); margin: 0; }
.ml-proc-step__desc { font-size: 14px; color: var(--ml-ink-mute); line-height: 1.6; }
.ml-proc-step__warning {
  margin-top: 10px;
  padding: 10px 14px;
  background: var(--ml-rouge-soft);
  color: var(--ml-rouge);
  border-radius: 8px;
  font-size: 12.5px;
  display: flex; align-items: start; gap: 8px;
}
.ml-proc-step__ref {
  margin-top: 8px;
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ml-ink-mute);
}
[lang="ar"] .ml-proc-step__ref { font-family: var(--f-ar); }

/* ── Bareme grid (Art. 52) ─────────────────────────────────────── */
.ml-bareme {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  max-width: 720px; margin: 0 auto;
}
@media (max-width: 720px) { .ml-bareme { grid-template-columns: repeat(2, 1fr); } }
.ml-bareme__cell {
  background: var(--ml-card);
  border: 1px solid var(--ml-line);
  border-radius: var(--r-sm);
  padding: 18px 16px;
  text-align: center;
  transition: border-color .15s;
}
.ml-bareme__cell:hover { border-color: var(--ml-green); }
.ml-bareme__years { font-family: var(--f-mono); font-size: 11px; color: var(--ml-ink-mute); text-transform: uppercase; letter-spacing: 0.08em; }
.ml-bareme__rate  { font-family: var(--f-mono); font-weight: 500; font-size: 22px; color: var(--ml-green); margin: 6px 0; line-height: 1; }
.ml-bareme__art   { font-family: var(--f-mono); font-size: 10.5px; color: var(--ml-ink-faint); }
[lang="ar"] .ml-bareme__years, [lang="ar"] .ml-bareme__art { font-family: var(--f-ar); }

/* ── Préavis table ─────────────────────────────────────────────── */
.ml-table {
  width: 100%; border-collapse: collapse; font-size: 14px;
}
.ml-table th {
  padding: 12px 14px;
  text-align: start;
  font-family: var(--f-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ml-ink-mute);
  border-bottom: 1px solid var(--ml-line-strong);
}
[lang="ar"] .ml-table th { font-family: var(--f-ar); letter-spacing: 0; text-transform: none; }
.ml-table td {
  padding: 14px;
  border-bottom: 1px solid var(--ml-line);
  color: var(--ml-ink-2);
}
.ml-table td:first-child { font-weight: 500; color: var(--ml-ink); }
.ml-table .ml-table__green { color: var(--ml-green); font-family: var(--f-mono); font-weight: 500; }

/* ── Section headers ───────────────────────────────────────────── */
.ml-section { padding: 56px 0; }
.ml-section--alt { background: var(--ml-bg-2); }
.ml-section__head {
  text-align: center; margin-bottom: 40px;
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}

/* ── Animations ────────────────────────────────────────────────── */
.ml-fadein { animation: mlFadeIn .35s cubic-bezier(.16,1,.3,1) both; }
@keyframes mlFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.ml-countup { animation: mlCount .5s cubic-bezier(.16,1,.3,1) both; }
@keyframes mlCount { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }

/* ── Utilities ─────────────────────────────────────────────────── */
.ml-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.ml-row--between { justify-content: space-between; }
.ml-stack { display: flex; flex-direction: column; gap: 12px; }
.ml-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.ml-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.ml-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 720px) {
  .ml-grid-2, .ml-grid-3, .ml-grid-4 { grid-template-columns: 1fr; }
}
.ml-center { text-align: center; }
.ml-mw-md { max-width: 640px; margin: 0 auto; }
.ml-mw-lg { max-width: 880px; margin: 0 auto; }
.ml-divider { height: 1px; background: var(--ml-line); margin: 16px 0; }

/* History entry */
.ml-hist {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px;
  padding: 12px 16px;
  background: var(--ml-bg-2);
  border-radius: 10px;
  border: 1px solid transparent;
  transition: border-color .15s;
}
.ml-hist:hover { border-color: var(--ml-line-strong); }
.ml-hist__date { font-family: var(--f-mono); font-size: 11px; color: var(--ml-ink-mute); }
.ml-hist__total { font-family: var(--f-serif); font-size: 18px; color: var(--ml-green); margin-top: 2px; }

/* Print-only header */
.ml-print-header { display: none; }

/* ════════════════════════════════════════════════════════════════
   PRINT — fond blanc forcé, lisibilité garantie
   ════════════════════════════════════════════════════════════════ */
@media print {
  :root, .dark {
    --ml-bg:        #ffffff !important;
    --ml-bg-2:      #f5f5f8 !important;
    --ml-card:      #ffffff !important;
    --ml-ink:       #111122 !important;
    --ml-ink-2:     #2c302e !important;
    --ml-ink-mute:  #555555 !important;
    --ml-ink-faint: #888888 !important;
    --ml-line:        rgba(0,0,0,0.10) !important;
    --ml-line-strong: rgba(0,0,0,0.18) !important;
    --ml-green:      #0f4d3a !important;
    --ml-green-soft: #e6efe9 !important;
  }
  html, body { background: #ffffff !important; color: #111122 !important; }

  .ml-nav, .no-print, button.ml-btn, .ml-tabs, footer { display: none !important; }

  /* Show only calc tab & step 5 */
  [x-show="activeTab==='calc'"] { display: block !important; }
  [x-show="activeTab==='procedure'"],
  [x-show="activeTab==='types'"],
  [x-show="activeTab==='refs'"],
  [x-show="activeTab==='dates'"] { display: none !important; }
  [x-show="wizardStep===1"],
  [x-show="wizardStep===2"],
  [x-show="wizardStep===3"],
  [x-show="wizardStep===4"],
  [x-show="wizardStep < 5"] { display: none !important; }
  [x-show="wizardStep===5 && results"] { display: block !important; }
  [x-show="form.type!=='faute_grave'"] { display: block !important; }
  [x-show="results && results.dommages > 0"] { display: block !important; }
  [x-show="results && results.unpaidAmount > 0"] { display: block !important; }
  [x-show="results && results.leaveAmount > 0"] { display: block !important; }
  [x-show="form.type==='faute_grave'"] { display: none !important; }

  .ml-total { background: #ffffff !important; color: #111122 !important; border: 2px solid var(--ml-green) !important; box-shadow: none !important; }
  .ml-total__small { color: #555555 !important; }
  .ml-total__amount { color: var(--ml-green) !important; }
  .ml-total__currency { color: #555555 !important; }
  .ml-total__tag { background: #f5f5f8 !important; color: #333333 !important; }

  .ml-card, .ml-amount { box-shadow: none !important; border: 1px solid #cccccc !important; }
  .ml-breakdown { background: #f9f9fb !important; border: 1px solid #eeeeee !important; }

  .ml-print-header {
    display: flex !important;
    justify-content: space-between; align-items: center;
    padding: 0 0 16px;
    margin-bottom: 24px;
    border-bottom: 2px solid var(--ml-green);
  }
  .ml-print-header h1 { font-family: var(--f-serif); font-size: 22pt; font-weight: 400; color: #111122; margin: 0; }
  .ml-print-header p  { font-family: var(--f-mono); font-size: 9pt; color: #777777; margin: 4px 0 0; }
  .ml-print-header__right { text-align: end; }

  * { text-shadow: none !important; animation: none !important; }
}
</style>
</head>
<body>

<!-- ════════════ PRINT-ONLY HEADER ════════════ -->
<div class="ml-print-header">
  <div>
    <h1>Moulinette · Licenciement</h1>
    <p>Code du Travail Marocain — Loi 65-99</p>
  </div>
  <div class="ml-print-header__right">
    <p>Imprimé le <span id="print-date"></span></p>
    <p style="font-style: italic;">Document à titre indicatif</p>
  </div>
</div>
<script>document.getElementById('print-date').textContent = new Date().toLocaleDateString('fr-MA');</script>

<!-- ════════════ NAVIGATION ════════════ -->
<header class="ml-nav no-print">
  <div class="ml-wrap">
    <div class="ml-nav__inner">
      <a href="#" class="ml-logo">
        <span class="ml-logo__mark">M</span>
        <span>
          <span x-text="t('app_title')"></span>
          <span class="ml-logo__sub" x-show="lang === 'fr'"> · Loi 65-99</span>
        </span>
      </a>
      <div class="ml-nav__spacer"></div>
      <div class="ml-nav__right">
        <button @click="darkMode = !darkMode"
          class="ml-theme"
          :title="darkMode ? 'Mode clair' : 'Mode sombre'">
          <span x-text="darkMode ? '☀' : '☾'"></span>
        </button>
        <div class="ml-lang">
          <button @click="setLang('fr')" :class="lang==='fr' ? 'is-active' : ''" lang="fr">FR</button>
          <button @click="setLang('ar')" :class="lang==='ar' ? 'is-active' : ''" lang="ar">عربية</button>
        </div>

        <!-- User pill + logout -->
        <div x-show="currentUser" class="ml-user-pill">
          <span class="ml-user-pill__avatar" x-text="currentUser ? currentUser.email[0].toUpperCase() : ''"></span>
          <span class="ml-user-pill__email ml-mono" x-text="currentUser ? currentUser.email : ''"></span>
          <button @click="signOut()" class="ml-user-pill__logout" title="Se déconnecter">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.5 6H11M8.5 3.5L11 6l-2.5 2.5"/>
              <path d="M7 1.5H2a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5h5"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="ml-tabs">
      <template x-for="tab in tabs" :key="tab.id">
        <button @click="activeTab=tab.id; wizardStep=1"
          :class="activeTab===tab.id ? 'is-active' : ''"
          class="ml-tab">
          <span class="ml-tab__icon" x-text="tab.icon"></span>
          <span x-text="t(tab.labelKey)"></span>
        </button>
      </template>
    </div>
  </div>
</header>

<!-- ════════════ MAIN ════════════ -->
<main class="ml-wrap" style="padding-top: 48px; padding-bottom: 80px;">

  <!-- ══════════════════════════════════════════
       TAB · CALCULATEUR (wizard)
  ══════════════════════════════════════════ -->
  <div x-show="activeTab==='calc'" x-cloak>

    <!-- Section header -->
    <div class="ml-section__head" style="margin-bottom: 32px;">
      <p class="ml-eyebrow"><span x-text="t('app_sub')"></span></p>
      <h1 class="ml-display"><span x-text="t('calc_title_pre')"></span> <em x-text="t('calc_title_em')"></em></h1>
      <p class="ml-lead ml-center" x-text="t('calc_sub')"></p>
    </div>

    <!-- Progress -->
    <div class="ml-progress" x-show="wizardStep < 5">
      <template x-for="n in [1,2,3,4]" :key="n">
        <div style="display:contents">
          <div class="ml-progress__step"
            :class="wizardStep > n ? 'is-done' : wizardStep === n ? 'is-current' : ''"
            x-text="wizardStep > n ? '✓' : n"></div>
          <div x-show="n < 4" class="ml-progress__line"
            :class="wizardStep > n ? 'is-done' : ''"></div>
        </div>
      </template>
    </div>

    <!-- STEP 1 · Type -->
    <div x-show="wizardStep===1" class="ml-fadein ml-mw-lg">
      <h2 class="ml-h2 ml-center" style="margin-bottom: 6px;" x-text="t('step1_title')"></h2>
      <p class="ml-lead ml-center" style="margin: 0 auto 32px;" x-text="t('step1_sub')"></p>
      <div class="ml-grid-2">
        <template x-for="opt in dismissalOptions()" :key="opt.value">
          <button @click="form.type=opt.value; nextStep()"
            :class="form.type===opt.value ? 'is-selected' : ''"
            class="ml-option">
            <div class="ml-row">
              <span class="ml-option__icon" x-text="opt.icon"></span>
              <span class="ml-chip" x-text="opt.badge"></span>
            </div>
            <div>
              <p class="ml-option__label" x-text="opt.label"></p>
              <p class="ml-option__desc" x-text="opt.desc"></p>
            </div>
          </button>
        </template>
      </div>
    </div>

    <!-- STEP 2 · Catégorie -->
    <div x-show="wizardStep===2" class="ml-fadein ml-mw-md">
      <h2 class="ml-h2 ml-center" style="margin-bottom: 6px;" x-text="t('step2_title')"></h2>
      <p class="ml-lead ml-center" style="margin: 0 auto 32px;" x-text="t('step2_sub')"></p>
      <div class="ml-grid-3">
        <template x-for="opt in categoryOptions()" :key="opt.value">
          <button @click="form.category=opt.value; nextStep()"
            :class="form.category===opt.value ? 'is-selected' : ''"
            class="ml-option" style="text-align: center; align-items: center;">
            <span class="ml-option__icon" style="width:48px; height:48px; font-size:22px;" x-text="opt.icon"></span>
            <div>
              <p class="ml-option__label" x-text="opt.label"></p>
              <p class="ml-option__desc" x-text="opt.desc"></p>
            </div>
          </button>
        </template>
      </div>
      <div class="ml-row ml-center" style="justify-content: center; margin-top: 28px;">
        <button @click="prevStep()" class="ml-btn ml-btn--ghost">
          <span x-text="lang==='ar' ? '→' : '←'"></span>
          <span x-text="t('back')"></span>
        </button>
      </div>
    </div>

    <!-- STEP 3 · Ancienneté + Dates -->
    <div x-show="wizardStep===3" class="ml-fadein ml-mw-md">
      <h2 class="ml-h2 ml-center" style="margin-bottom: 6px;" x-text="t('step3_title')"></h2>
      <p class="ml-lead ml-center" style="margin: 0 auto 32px;" x-text="t('step3_sub')"></p>

      <!-- Dates de contrat -->
      <div class="ml-card" style="margin-bottom: 16px;">
        <div class="ml-grid-2" style="gap: 14px;">
          <div class="ml-field">
            <label class="ml-field__label" x-text="t('hire_date_label')"></label>
            <input type="date" x-model="form.hireDate"
              @change="updateSeniorityFromDate()"
              :max="new Date().toISOString().split('T')[0]"
              class="ml-input">
          </div>
          <div class="ml-field">
            <label class="ml-field__label" x-text="t('end_date_label')"></label>
            <input type="date" x-model="form.endDate"
              @change="updateSeniorityFromDate()"
              :max="new Date().toISOString().split('T')[0]"
              class="ml-input">
          </div>
        </div>
        <div x-show="form.hireDate" class="ml-row ml-row--between" style="margin-top: 14px;">
          <span class="ml-chip ml-chip--green">
            <span x-text="t('hire_date_calculated')"></span>
            <strong x-text="hireDateLabel()" style="margin-left: 4px;"></strong>
          </span>
          <button @click="form.hireDate=''; form.endDate=''" class="ml-btn ml-btn--ghost ml-btn--sm"
            x-text="t('hire_date_clear')"></button>
        </div>
      </div>

      <!-- Slider ancienneté manuel -->
      <div class="ml-card">
        <div class="ml-center" style="margin-bottom: 24px;">
          <div style="font-family: var(--f-sans); font-weight: 600; font-size: 64px; line-height: 1; letter-spacing: -0.04em; color: var(--ml-ink); font-variant-numeric: tabular-nums;" x-text="form.seniority"></div>
          <div class="ml-mute" style="font-size: 13px; margin-top: 8px;" x-text="t('years_label')"></div>
        </div>
        <input type="range" min="1" max="40" x-model.number="form.seniority"
          @input="form.hireDate = ''" class="ml-range">
        <div class="ml-row ml-row--between" style="margin-top: 8px;">
          <span class="ml-mono ml-faint" style="font-size: 11px;">1</span>
          <span class="ml-mono ml-faint" style="font-size: 11px;">20</span>
          <span class="ml-mono ml-faint" style="font-size: 11px;">40</span>
        </div>
      </div>

      <div class="ml-row ml-row--between" style="margin-top: 28px;">
        <button @click="prevStep()" class="ml-btn ml-btn--ghost">
          <span x-text="lang==='ar' ? '→' : '←'"></span>
          <span x-text="t('back')"></span>
        </button>
        <button @click="nextStep()" :disabled="!form.seniority || form.seniority < 1"
          class="ml-btn ml-btn--primary">
          <span x-text="t('next')"></span>
          <span class="ml-arrow" x-text="lang==='ar' ? '←' : '→'"></span>
        </button>
      </div>
    </div>

    <!-- STEP 4 · Salaire & compléments -->
    <div x-show="wizardStep===4" class="ml-fadein ml-mw-md">
      <h2 class="ml-h2 ml-center" style="margin-bottom: 6px;" x-text="t('step4_title')"></h2>
      <p class="ml-lead ml-center" style="margin: 0 auto 32px;" x-text="t('step4_sub')"></p>

      <!-- Salaire -->
      <div class="ml-card">
        <div class="ml-center" style="margin-bottom: 20px;">
          <div style="font-family: var(--f-sans); font-weight: 600; font-size: 48px; line-height: 1; letter-spacing: -0.035em; font-variant-numeric: tabular-nums;">
            <span x-text="form.salary ? fmt(form.salary) : '—'"></span>
            <span class="ml-mono" style="font-size: 18px; color: var(--ml-ink-mute);">MAD</span>
          </div>
          <div class="ml-mute ml-mono" style="font-size: 11.5px; margin-top: 10px; letter-spacing: 0.08em;">
            <span x-text="t('equiv_hourly')"></span>
            <span style="color: var(--ml-green); font-weight: 500;" x-text="form.salary ? fmt(form.salary/191)+' MAD/h' : '—'"></span>
          </div>
        </div>
        <div class="ml-field">
          <label class="ml-field__label" x-text="t('salary_placeholder')"></label>
          <div style="position: relative;">
            <input type="number" x-model.number="form.salary" min="0"
              class="ml-input ml-input--center ml-input--lg" placeholder="0">
            <span class="ml-mono" style="position: absolute; inset-inline-end: 16px; top: 50%; transform: translateY(-50%); color: var(--ml-ink-faint); font-size: 14px;">MAD</span>
          </div>
        </div>
        <p class="ml-mute ml-center" style="font-size: 12px; margin-top: 14px;" x-text="t('smig_ref')"></p>
      </div>

      <!-- Compléments -->
      <div class="ml-card" style="margin-top: 14px;">
        <div class="ml-field">
          <label class="ml-field__label">
            <span x-text="t('unpaid_label')"></span>
          </label>
          <p class="ml-mute" style="font-size: 12px; margin: 4px 0 8px;" x-text="t('unpaid_help')"></p>
          <input type="number" x-model.number="form.unpaidDays" min="0" max="365"
            class="ml-input ml-input--center" placeholder="0">
        </div>
        <div class="ml-divider"></div>
        <div class="ml-field">
          <label class="ml-field__label">
            <span x-text="t('leave_label')"></span>
          </label>
          <p class="ml-mute" style="font-size: 12px; margin: 4px 0 8px;" x-text="t('leave_help')"></p>
          <input type="number" x-model.number="form.unusedLeave" min="0" max="365"
            class="ml-input ml-input--center" placeholder="0">
        </div>
        <div x-show="form.salary && (form.unpaidDays > 0 || form.unusedLeave > 0)"
          class="ml-divider"></div>
        <p x-show="form.salary && (form.unpaidDays > 0 || form.unusedLeave > 0)"
          class="ml-mute ml-center ml-mono" style="font-size: 12px;">
          <span x-text="t('daily_rate') + ' :'"></span>
          <span style="color: var(--ml-green); font-weight: 500;" x-text="form.salary ? fmt(form.salary/26) + ' MAD/' + (lang==='ar'?'يوم':'jour') : ''"></span>
        </p>
      </div>

      <div class="ml-row ml-row--between" style="margin-top: 28px;">
        <button @click="prevStep()" class="ml-btn ml-btn--ghost">
          <span x-text="lang==='ar' ? '→' : '←'"></span>
          <span x-text="t('back')"></span>
        </button>
        <button @click="calculateAndNext()" :disabled="!form.salary || form.salary < 1"
          class="ml-btn ml-btn--accent ml-btn--lg">
          <span x-text="t('calculate')"></span>
          <span class="ml-arrow">→</span>
        </button>
      </div>
    </div>

    <!-- STEP 5 · Résultats -->
    <div x-show="wizardStep===5 && results" class="ml-fadein">

      <!-- Faute grave warning -->
      <div x-show="form.type==='faute_grave'" class="ml-mw-md">
        <div class="ml-card ml-card--lg ml-center" style="border: 1px solid var(--ml-rouge-soft);">
          <div style="font-size: 48px; margin-bottom: 12px;">🚨</div>
          <h2 class="ml-h2" style="color: var(--ml-rouge); margin-bottom: 12px;" x-text="t('faute_grave_warning_title')"></h2>
          <p class="ml-lead" style="margin: 0 auto 16px;" x-text="t('faute_grave_warning')"></p>
          <span class="ml-chip ml-chip--rouge" x-text="t('faute_grave_ref')"></span>
        </div>
        <button @click="wizardStep=1; results=null"
          class="ml-btn ml-btn--ghost ml-btn--block" style="margin-top: 20px;"
          x-text="t('restart')"></button>
      </div>

      <!-- Résultats normaux -->
      <div x-show="form.type!=='faute_grave'" class="ml-mw-lg">

        <!-- Total card -->
        <div class="ml-total ml-countup" style="margin-bottom: 28px;">
          <span class="ml-total__small" x-text="t('total')"></span>
          <div>
            <span class="ml-total__amount" x-text="results ? fmt(results.total) : ''"></span>
            <span class="ml-total__currency">MAD</span>
          </div>
          <div class="ml-total__tags">
            <span class="ml-total__tag" x-text="t('label_'+form.type)"></span>
            <span class="ml-total__tag" x-text="t(form.category)"></span>
            <span class="ml-total__tag" x-text="results ? results.seniorityLabel : ''"></span>
          </div>
        </div>

        <!-- Breakdown lines -->
        <div class="ml-stack" style="gap: 12px; margin-bottom: 24px;">

          <!-- Indemnité légale -->
          <div class="ml-amount">
            <div>
              <div class="ml-row" style="gap: 10px;">
                <div class="ml-amount__icon">§</div>
                <div>
                  <p class="ml-amount__label" x-text="t('legal_indemnity')"></p>
                </div>
              </div>
              <div class="ml-breakdown">
                <div class="ml-breakdown__head">
                  <span x-text="t('calc_hourly_rate') + ' :'"></span>
                  <span class="ml-mono" style="color: var(--ml-ink); letter-spacing: 0;" x-text="results ? results.salaireHoraireFormula : ''"></span>
                </div>
                <template x-if="results">
                  <div class="ml-stack" style="gap: 8px;">
                    <template x-for="line in results.breakdown" :key="line.label">
                      <div class="ml-breakdown__row">
                        <div class="ml-breakdown__main">
                          <span class="ml-breakdown__label" x-text="line.label"></span>
                          <span class="ml-breakdown__amount" x-text="fmt(line.amount)+' MAD'"></span>
                        </div>
                        <span class="ml-breakdown__formula" x-text="line.formula"></span>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
            <span class="ml-amount__value ml-amount__value--accent"
              x-text="results ? fmt(results.indemniteLegale)+' MAD' : ''"></span>
          </div>

          <!-- Préavis -->
          <div class="ml-amount">
            <div>
              <div class="ml-row" style="gap: 10px;">
                <div class="ml-amount__icon">⏱</div>
                <div>
                  <p class="ml-amount__label" x-text="t('notice_indemnity')"></p>
                  <p class="ml-amount__sub" x-text="results ? results.preavislabel : ''"></p>
                  <p class="ml-amount__formula" x-text="results ? results.preFormula : ''"></p>
                </div>
              </div>
            </div>
            <span class="ml-amount__value ml-amount__value--blue"
              x-text="results ? fmt(results.indemnitePreavis)+' MAD' : ''"></span>
          </div>

          <!-- Salaires non payés -->
          <div x-show="results && results.unpaidAmount > 0" class="ml-amount">
            <div>
              <div class="ml-row" style="gap: 10px;">
                <div class="ml-amount__icon">∑</div>
                <div>
                  <p class="ml-amount__label" x-text="t('unpaid_indemnity')"></p>
                  <p class="ml-amount__sub">
                    <span x-text="results ? results.unpaidDays : 0"></span>
                    <span x-text="lang==='ar' ? 'يوم' : 'jours'"></span>
                  </p>
                  <p class="ml-amount__formula" x-text="results ? results.unpaidFormula : ''"></p>
                </div>
              </div>
            </div>
            <span class="ml-amount__value ml-amount__value--accent"
              x-text="results ? fmt(results.unpaidAmount)+' MAD' : ''"></span>
          </div>

          <!-- Congés non pris -->
          <div x-show="results && results.leaveAmount > 0" class="ml-amount">
            <div>
              <div class="ml-row" style="gap: 10px;">
                <div class="ml-amount__icon">☀</div>
                <div>
                  <p class="ml-amount__label" x-text="t('leave_indemnity')"></p>
                  <p class="ml-amount__sub" x-text="t('leave_ref')"></p>
                  <p class="ml-amount__formula" x-text="results ? results.leaveFormula : ''"></p>
                </div>
              </div>
            </div>
            <span class="ml-amount__value ml-amount__value--ochre"
              x-text="results ? fmt(results.leaveAmount)+' MAD' : ''"></span>
          </div>

          <!-- D&I -->
          <div x-show="results && results.dommages > 0" class="ml-amount">
            <div>
              <div class="ml-row" style="gap: 10px;">
                <div class="ml-amount__icon">⚖</div>
                <div>
                  <p class="ml-amount__label" x-text="t('damages')"></p>
                  <p class="ml-amount__sub" x-text="t('damages_ref')"></p>
                  <p class="ml-amount__formula" x-text="results ? results.domFormula : ''"></p>
                </div>
              </div>
            </div>
            <span class="ml-amount__value ml-amount__value--rouge"
              x-text="results ? fmt(results.dommages)+' MAD' : ''"></span>
          </div>

        </div>

        <!-- Infos dossier (optionnel — pour le PDF) -->
        <div class="ml-card ml-card--bordered no-print" style="margin-bottom: 16px;">
          <div class="ml-row ml-row--between" style="margin-bottom: 14px;">
            <span class="ml-eyebrow" style="display:inline-flex; gap:6px;">
              <span>Informations dossier</span>
            </span>
            <span class="ml-chip" style="font-size:10px;" x-text="t('dossier_opt')"></span>
          </div>
          <div class="ml-grid-2" style="gap: 12px; margin-bottom: 12px;">
            <div class="ml-field">
              <label class="ml-field__label" x-text="t('dossier_nom')"></label>
              <input type="text" x-model="dossier.nomSalarie" class="ml-input"
                :placeholder="t('dossier_nom_ph')">
            </div>
            <div class="ml-field">
              <label class="ml-field__label" x-text="t('dossier_poste')"></label>
              <input type="text" x-model="dossier.poste" class="ml-input"
                :placeholder="t('dossier_poste_ph')">
            </div>
          </div>
          <div class="ml-field">
            <label class="ml-field__label" x-text="t('dossier_ref')"></label>
            <input type="text" x-model="dossier.ref" class="ml-input"
              :placeholder="t('dossier_ref_ph')">
          </div>
        </div>

        <!-- Disclaimer -->
        <div class="ml-card ml-card--bordered" style="background: var(--ml-ochre-soft); border-color: transparent; margin-bottom: 20px;">
          <p style="color: #6b4515; font-size: 13px; margin: 0;" x-text="t('disclaimer')"></p>
        </div>

        <!-- Actions -->
        <div class="ml-row no-print" style="gap: 10px; flex-wrap: wrap;">
          <button @click="wizardStep=1; results=null; dossier={nomSalarie:'',poste:'',ref:''}" class="ml-btn" style="flex: 1; min-width: 120px;" x-text="t('restart')"></button>
          <button @click="shareUrl()" class="ml-btn"
            :style="copiedUrl ? 'background: var(--ml-green); color: #f6f3ec; border-color: var(--ml-green);' : ''"
            style="flex: 1; min-width: 120px;">
            <span x-text="copiedUrl ? t('share_copied') : t('share_btn')"></span>
          </button>
          <button @click="generatePDF()" class="ml-btn ml-btn--primary" style="flex: 1; min-width: 140px;">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
              <path d="M7 1v8M4 6l3 3 3-3"/><path d="M2 10v1a1 1 0 001 1h8a1 1 0 001-1v-1"/>
            </svg>
            <span x-text="t('pdf_btn')"></span>
          </button>
        </div>

        <!-- Séparateur -->
        <div class="no-print" style="height: 1px; background: var(--ml-line); margin: 36px 0;"></div>

        <!-- Sauvegarder dossier (Supabase) -->
        <button @click="saveDossier()" :disabled="savingDossier"
          class="ml-btn ml-btn--accent ml-btn--block ml-btn--lg no-print"
          :style="dossierSaved ? 'background: var(--ml-green-2); border-color: var(--ml-green-2);' : ''">
          <template x-if="!savingDossier && !dossierSaved">
            <span style="display:inline-flex; align-items:center; gap:8px;">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
                <path d="M11 12H3a1 1 0 01-1-1V3a1 1 0 011-1h6l3 3v6a1 1 0 01-1 1z"/><path d="M9 12V8H5v4M5 2v3h3"/>
              </svg>
              <span x-text="t('dossier_save_btn')"></span>
            </span>
          </template>
          <template x-if="savingDossier"><span class="ml-spin">⏳</span></template>
          <template x-if="dossierSaved && !savingDossier"><span x-text="t('dossier_saved')"></span></template>
        </button>

        <!-- Historique -->
        <div x-show="history.length > 0" class="no-print" style="margin-top: 28px;">
          <button @click="showHistory = !showHistory"
            class="ml-btn ml-btn--ghost ml-btn--block"
            style="justify-content: space-between; background: var(--ml-bg-2); border-color: var(--ml-line);">
            <span style="display: inline-flex; align-items: center; gap: 8px;">
              <span class="ml-mono" style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ml-ink-mute);" x-text="t('history_title')"></span>
              <span class="ml-chip ml-chip--green" style="height: 20px; font-size: 10px;" x-text="history.length"></span>
            </span>
            <span :class="showHistory ? 'rotate-180' : ''" style="display:inline-block; transition: transform .25s;" :style="showHistory ? 'transform: rotate(180deg);' : ''">▾</span>
          </button>
          <div x-show="showHistory" class="ml-stack" style="margin-top: 10px; gap: 8px;">
            <template x-for="entry in history" :key="entry.id">
              <div class="ml-hist">
                <div>
                  <div class="ml-row" style="gap: 6px; flex-wrap: wrap;">
                    <span class="ml-hist__date" x-text="entry.date"></span>
                    <span class="ml-chip ml-chip--green" style="height: 20px; font-size: 10px;" x-text="t('label_'+entry.type)"></span>
                    <span class="ml-chip" style="height: 20px; font-size: 10px;" x-text="t(entry.category)"></span>
                    <span class="ml-chip" style="height: 20px; font-size: 10px;" x-text="entry.seniority + (lang==='ar' ? ' سنة' : ' ans')"></span>
                  </div>
                  <div class="ml-hist__total" x-text="fmt(entry.total) + ' MAD'"></div>
                </div>
                <button @click="restoreFromHistory(entry)" class="ml-btn ml-btn--sm ml-btn--primary" x-text="t('history_restore')"></button>
              </div>
            </template>
            <button @click="clearHistory()" class="ml-btn ml-btn--ghost ml-btn--sm" style="margin-top: 4px;" x-text="t('history_clear')"></button>
          </div>
        </div>

      </div>
    </div>

    <!-- Barème (visible avant les résultats) -->
    <div x-show="wizardStep < 5" style="margin-top: 64px;">
      <p class="ml-eyebrow ml-center" style="display: flex; justify-content: center; margin-bottom: 18px;">
        <span x-text="t('bareme_title')"></span>
      </p>
      <div class="ml-bareme">
        <template x-for="row in baremeRows()" :key="row.years">
          <div class="ml-bareme__cell">
            <div class="ml-bareme__years" x-text="row.years"></div>
            <div class="ml-bareme__rate" x-text="row.rate"></div>
            <div class="ml-bareme__art">art. 52</div>
          </div>
        </template>
      </div>
    </div>

  </div>

  <!-- ══════════════════════════════════════════
       TAB · MES DOSSIERS (Supabase)
  ══════════════════════════════════════════ -->
  <div x-show="activeTab==='dossiers'" x-cloak class="ml-fadein">
    <div class="ml-section__head">
      <p class="ml-eyebrow"><span x-text="t('app_sub')"></span></p>
      <h2 class="ml-h2"><span x-text="t('dossiers_title_pre')"></span> <em x-text="t('dossiers_title_em')"></em></h2>
      <p class="ml-lead ml-center" x-text="t('dossiers_sub')"></p>
    </div>

    <div class="ml-mw-lg">

      <!-- Budget summary band -->
      <div x-show="dossiers.length > 0" class="ml-card ml-card--ink" style="margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
        <div>
          <div class="ml-total__small" x-text="t('dossiers_budget')"></div>
          <div style="font-weight: 600; font-size: 32px; letter-spacing: -0.03em; margin-top: 4px;">
            <span x-text="fmt(dossiersBudget())"></span>
            <span class="ml-mono" style="font-size: 15px; color: rgba(246,243,236,0.6);">MAD</span>
          </div>
        </div>
        <div style="text-align: end;">
          <div class="ml-chip ml-chip--green" style="background: rgba(74,222,128,0.18); color: #4ade80;">
            <span x-text="dossiers.length"></span>&nbsp;<span x-text="t('dossiers_count')"></span>
          </div>
        </div>
      </div>

      <!-- Loading -->
      <div x-show="loadingDossiers" class="ml-center ml-mute" style="padding: 40px;">⏳</div>

      <!-- Empty state -->
      <div x-show="!loadingDossiers && dossiers.length === 0" class="ml-card ml-card--lg ml-center" style="padding: 56px 32px;">
        <div style="font-size: 44px; margin-bottom: 16px; opacity: 0.4;">📁</div>
        <h3 class="ml-h3" style="margin-bottom: 8px;" x-text="t('dossiers_empty_title')"></h3>
        <p class="ml-mute" style="font-size: 14px; max-width: 38ch; margin: 0 auto 24px;" x-text="t('dossiers_empty_sub')"></p>
        <button @click="activeTab='calc'; wizardStep=1" class="ml-btn ml-btn--primary" x-text="t('dossiers_empty_cta')"></button>
      </div>

      <!-- Dossiers list -->
      <div x-show="!loadingDossiers && dossiers.length > 0" class="ml-stack" style="gap: 10px;">
        <template x-for="d in dossiers" :key="d.id">
          <div class="ml-card" style="padding: 18px 20px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;">
            <div style="min-width: 0;">
              <div class="ml-row" style="gap: 8px; flex-wrap: wrap; margin-bottom: 6px;">
                <span style="font-weight: 600; font-size: 15px;" x-text="d.nom_salarie || t('dossier_unnamed')"></span>
                <button @click="cycleDossierStatus(d)"
                  class="ml-chip"
                  :style="d.status==='closed' ? 'background: var(--ml-green-soft); color: var(--ml-green); border-color: transparent; cursor:pointer;' : d.status==='in_progress' ? 'background: var(--ml-ochre-soft); color: #6b4515; border-color: transparent; cursor:pointer;' : 'cursor:pointer;'"
                  x-text="dossierStatusLabel(d.status)"></button>
              </div>
              <div class="ml-row ml-mono" style="gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--ml-ink-mute);">
                <span x-show="d.poste" x-text="d.poste"></span>
                <span x-show="d.poste">·</span>
                <span x-text="t('label_'+d.type)"></span>
                <span>·</span>
                <span x-text="d.seniority + (lang==='ar' ? ' سنة' : ' ans')"></span>
                <span>·</span>
                <span x-text="dossierDate(d)"></span>
                <span x-show="d.ref">·</span>
                <span x-show="d.ref" x-text="d.ref"></span>
              </div>
              <div style="font-weight: 600; font-size: 19px; color: var(--ml-green); margin-top: 8px; letter-spacing: -0.02em;">
                <span x-text="fmt(d.total)"></span>
                <span class="ml-mono" style="font-size: 12px; color: var(--ml-ink-mute);">MAD</span>
              </div>
            </div>
            <div class="ml-row" style="gap: 6px;">
              <button @click="restoreDossier(d)" class="ml-btn ml-btn--sm ml-btn--primary" x-text="t('dossier_open')"></button>
              <button @click="deleteDossier(d.id)" class="ml-btn ml-btn--sm ml-btn--icon" title="Supprimer"
                style="color: var(--ml-rouge);">
                <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2.5 4h9M5 4V2.5h4V4M5.5 6.5v4M8.5 6.5v4M3.5 4l.5 8a1 1 0 001 1h4a1 1 0 001-1l.5-8"/>
                </svg>
              </button>
            </div>
          </div>
        </template>
      </div>

    </div>
  </div>

  <!-- ══════════════════════════════════════════
       TAB · PROCÉDURE
  ══════════════════════════════════════════ -->
  <div x-show="activeTab==='procedure'" x-cloak class="ml-fadein">
    <div class="ml-section__head">
      <p class="ml-eyebrow"><span x-text="t('procedure_sub')"></span></p>
      <h2 class="ml-h2"><span x-text="t('procedure_title_pre')"></span> <em x-text="t('procedure_title_em')"></em></h2>
    </div>

    <div class="ml-mw-lg ml-stack" style="gap: 12px; margin-bottom: 48px;">
      <template x-for="(step, i) in procedureSteps()" :key="i">
        <div class="ml-proc-step">
          <div class="ml-proc-step__num" x-text="i+1"></div>
          <div>
            <div class="ml-proc-step__title">
              <h4 x-text="step.title"></h4>
              <span x-show="step.badge" class="ml-chip ml-chip--green" x-text="step.badge"></span>
            </div>
            <p class="ml-proc-step__desc" x-text="step.desc"></p>
            <div x-show="step.warning" class="ml-proc-step__warning">
              <span>⚠</span><span x-text="step.warning"></span>
            </div>
            <p x-show="step.ref" class="ml-proc-step__ref" x-text="step.ref"></p>
          </div>
        </div>
      </template>
    </div>

    <!-- Préavis table -->
    <div class="ml-mw-lg">
      <div class="ml-card ml-card--lg">
        <h3 class="ml-h3" style="margin-bottom: 18px;" x-text="t('preavis_title')"></h3>
        <table class="ml-table">
          <thead>
            <tr>
              <th x-text="t('preavis_cat')"></th>
              <th x-text="t('preavis_less1')"></th>
              <th x-text="t('preavis_1_5')"></th>
              <th x-text="t('preavis_more5')"></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td x-text="t('cadre')"></td>
              <td class="ml-table__green" x-text="t('1mois')"></td>
              <td class="ml-table__green" x-text="t('2mois')"></td>
              <td class="ml-table__green" x-text="t('3mois')"></td>
            </tr>
            <tr>
              <td x-text="t('employe')"></td>
              <td class="ml-table__green" x-text="t('8jours')"></td>
              <td class="ml-table__green" x-text="t('1mois')"></td>
              <td class="ml-table__green" x-text="t('2mois')"></td>
            </tr>
            <tr>
              <td x-text="t('ouvrier')"></td>
              <td class="ml-table__green" x-text="t('8jours')"></td>
              <td class="ml-table__green" x-text="t('8jours')"></td>
              <td class="ml-table__green" x-text="t('1mois')"></td>
            </tr>
          </tbody>
        </table>
        <p class="ml-faint ml-mono" style="font-size: 11px; margin-top: 14px;" x-text="t('preavis_ref')"></p>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       TAB · TYPES
  ══════════════════════════════════════════ -->
  <div x-show="activeTab==='types'" x-cloak class="ml-fadein">
    <div class="ml-section__head">
      <p class="ml-eyebrow"><span x-text="t('app_sub')"></span></p>
      <h2 class="ml-h2"><span x-text="t('types_title_pre')"></span> <em x-text="t('types_title_em')"></em></h2>
    </div>

    <div class="ml-grid-2" style="gap: 16px; margin-bottom: 32px;">
      <template x-for="type in dismissalTypes()" :key="type.id">
        <article class="ml-type" :style="`border-top-color: ${type.color}`">
          <div class="ml-type__head">
            <div class="ml-type__icon" :style="`background: ${type.color}22; color: ${type.color}`" x-text="type.icon"></div>
            <div>
              <span class="ml-chip" :style="`background: ${type.color}22; color: ${type.color}; border-color: transparent;`" x-text="type.badge"></span>
              <h3 class="ml-type__title" style="margin-top: 8px;" x-text="type.title"></h3>
            </div>
          </div>
          <p class="ml-type__desc" x-text="type.desc"></p>
          <ul class="ml-type__list">
            <template x-for="item in type.points" :key="item">
              <li x-text="item"></li>
            </template>
          </ul>
          <div x-show="type.warning" class="ml-type__warning" x-text="type.warning"></div>
          <p class="ml-type__ref" x-text="type.ref"></p>
        </article>
      </template>
    </div>

    <!-- Fautes graves -->
    <div class="ml-card ml-card--lg">
      <h3 class="ml-h3" style="margin-bottom: 6px;" x-text="t('fautes_graves_title')"></h3>
      <p class="ml-faint ml-mono" style="font-size: 11px; margin-bottom: 18px;" x-text="t('fautes_graves_ref')"></p>
      <div class="ml-grid-2" style="gap: 8px;">
        <template x-for="f in fautesGraves()" :key="f">
          <div style="display: flex; align-items: start; gap: 10px; padding: 10px 14px; background: var(--ml-bg-2); border-radius: 8px;">
            <span style="color: var(--ml-rouge); flex-shrink: 0;">•</span>
            <span style="font-size: 13px; color: var(--ml-ink-2);" x-text="f"></span>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       TAB · RÉFÉRENCES
  ══════════════════════════════════════════ -->
  <div x-show="activeTab==='refs'" x-cloak class="ml-fadein">
    <div class="ml-section__head">
      <p class="ml-eyebrow"><span x-text="t('app_sub')"></span></p>
      <h2 class="ml-h2"><span x-text="t('refs_title_pre')"></span> <em x-text="t('refs_title_em')"></em></h2>
    </div>

    <div class="ml-mw-lg ml-stack" style="gap: 10px; margin-bottom: 36px;">
      <template x-for="(ref, i) in legalRefs()" :key="ref.article">
        <div class="ml-ref" :class="openRef===i ? 'is-open' : ''">
          <button @click="openRef===i ? openRef=null : openRef=i" class="ml-ref__head">
            <span class="ml-ref__art" x-text="ref.article"></span>
            <span class="ml-ref__title" x-text="ref.title"></span>
            <span class="ml-ref__chev">▾</span>
          </button>
          <div x-show="openRef===i" x-collapse>
            <div class="ml-ref__body" x-text="ref.content"></div>
          </div>
        </div>
      </template>
    </div>

    <!-- Resources -->
    <div class="ml-mw-lg">
      <h3 class="ml-h3 ml-center" style="margin-bottom: 18px;" x-text="t('resources_title')"></h3>
      <div class="ml-grid-3" style="gap: 12px;">
        <template x-for="r in resources()" :key="r.name">
          <div class="ml-card ml-card--bordered ml-card--hover" style="padding: 16px; display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 22px;" x-text="r.icon"></span>
            <div>
              <p style="font-weight: 500; font-size: 14px; margin: 0;" x-text="r.name"></p>
              <p class="ml-mute" style="font-size: 12px; margin: 2px 0 0;" x-text="r.desc"></p>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       TAB · DATES LÉGALES
  ══════════════════════════════════════════ -->
  <div x-show="activeTab==='dates'" x-cloak class="ml-fadein">
    <div class="ml-section__head">
      <p class="ml-eyebrow"><span x-text="t('app_sub')"></span></p>
      <h2 class="ml-h2"><span x-text="t('dates_title_pre')"></span> <em x-text="t('dates_title_em')"></em></h2>
      <p class="ml-lead ml-center" x-text="t('dates_sub')"></p>
    </div>

    <div class="ml-mw-md">

      <div class="ml-card ml-card--lg ml-stack">

        <div class="ml-field">
          <label class="ml-field__label" x-text="t('dates_notif_label')"></label>
          <input type="date" x-model="dateForm.notifDate" class="ml-input">
        </div>

        <div class="ml-field">
          <label class="ml-field__label" x-text="t('dates_type_label')"></label>
          <div class="ml-grid-2" style="gap: 8px;">
            <template x-for="opt in dismissalOptions()" :key="opt.value">
              <button @click="dateForm.type = opt.value"
                :class="dateForm.type === opt.value ? 'is-selected' : ''"
                class="ml-option" style="padding: 14px; text-align: center; flex-direction: row; align-items: center; gap: 10px;">
                <span class="ml-option__icon" style="width: 32px; height: 32px; font-size: 16px;" x-text="opt.icon"></span>
                <span class="ml-option__label" style="font-size: 13px;" x-text="opt.label"></span>
              </button>
            </template>
          </div>
        </div>

        <div class="ml-field">
          <label class="ml-field__label" x-text="t('dates_category_label')"></label>
          <div class="ml-grid-3" style="gap: 8px;">
            <template x-for="opt in categoryOptions()" :key="opt.value">
              <button @click="dateForm.category = opt.value"
                :class="dateForm.category === opt.value ? 'is-selected' : ''"
                class="ml-option" style="padding: 14px; text-align: center; align-items: center;">
                <span class="ml-option__icon" x-text="opt.icon"></span>
                <span class="ml-option__label" style="font-size: 13px;" x-text="opt.label"></span>
              </button>
            </template>
          </div>
        </div>

        <div x-show="dateForm.type !== 'faute_grave'" class="ml-field">
          <label class="ml-field__label">
            <span x-text="t('dates_seniority_label')"></span>
            <span class="ml-mono" style="color: var(--ml-green); margin-inline-start: 6px;" x-text="dateForm.seniority"></span>
          </label>
          <input type="range" min="1" max="40" x-model.number="dateForm.seniority" class="ml-range">
        </div>

        <button @click="calculateDates()"
          :disabled="!dateForm.notifDate || !dateForm.category"
          class="ml-btn ml-btn--accent ml-btn--lg ml-btn--block">
          <span x-text="t('dates_calculate')"></span>
          <span class="ml-arrow">→</span>
        </button>
      </div>

      <!-- Timeline results -->
      <div x-show="dateResults" style="margin-top: 32px;">
        <p class="ml-eyebrow" style="margin-bottom: 18px;"><span x-text="t('dates_timeline_title')"></span></p>
        <div class="ml-card ml-card--lg">
          <div class="ml-timeline">
            <template x-if="dateResults">
              <div>
                <template x-for="(step, i) in dateResults.steps" :key="i">
                  <div class="ml-tl-step" :class="step.highlight ? 'ml-tl-step--highlight' : ''">
                    <div class="ml-tl-step__col">
                      <div class="ml-tl-step__dot" x-text="step.icon"></div>
                      <div class="ml-tl-step__line"></div>
                    </div>
                    <div class="ml-tl-step__body">
                      <p class="ml-tl-step__label" x-text="step.label"></p>
                      <p class="ml-tl-step__date" x-text="step.date"></p>
                      <span x-show="step.badge"
                        class="ml-tl-step__badge"
                        :class="step.badge && step.badge.cls.includes('red') ? 'ml-tl-step__badge--danger' : step.badge && step.badge.cls.includes('amber') ? 'ml-tl-step__badge--warn' : 'ml-tl-step__badge--ok'"
                        x-text="step.badge ? step.badge.text : ''"></span>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>

        <button @click="dateResults = null; dateForm.notifDate = ''; dateForm.category = null"
          class="ml-btn ml-btn--ghost ml-btn--block" style="margin-top: 14px;"
          x-text="t('dates_reset')"></button>
      </div>

    </div>
  </div>

</main>

<!-- ════════════ FOOTER ════════════ -->
<footer class="no-print" style="border-top: 1px solid var(--ml-line); padding: 28px 0; margin-top: 32px;">
  <div class="ml-wrap ml-center">
    <p class="ml-mute" style="font-size: 12.5px; margin: 0;" x-text="t('footer')"></p>
  </div>
</footer>

<!-- jsPDF + AutoTable — génération PDF côté client -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="app.js?v=12"></script>
</body>
</html>
