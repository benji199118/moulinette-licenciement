<!DOCTYPE html>
<html x-data="app()" :dir="lang==='ar'?'rtl':'ltr'" :lang="lang" :class="darkMode ? '' : 'light'" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moulinette Licenciement | المغرب</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  [lang="fr"] *, [lang="fr"] body { font-family: 'Inter', sans-serif; }
  [lang="ar"] *, [lang="ar"] body { font-family: 'Cairo', sans-serif; }

  /* ── CSS VARIABLES (dark default) ── */
  :root {
    --c-bg:         #07070f;
    --c-surface:    #0e0e1a;
    --c-surface2:   #141424;
    --c-surface3:   #1c1c30;
    --c-border:     #2e2e50;
    --c-text:       #e2e2f0;
    --c-muted:      #6b6b9a;
    --c-faint:      #4a4a70;
    --c-glass:      rgba(14,14,26,0.85);
    --c-glass-b:    rgba(255,255,255,0.07);
    --c-divider:    #2e2e50;
  }

  /* ── LIGHT MODE OVERRIDES ── */
  .light {
    --c-bg:         #f3f3fb;
    --c-surface:    #ffffff;
    --c-surface2:   #eeeef8;
    --c-surface3:   #e4e4f4;
    --c-border:     #d8d8ec;
    --c-text:       #18182e;
    --c-muted:      #5a5a8a;
    --c-faint:      #9090b8;
    --c-glass:      rgba(255,255,255,0.92);
    --c-glass-b:    rgba(0,0,0,0.08);
    --c-divider:    #d8d8ec;
  }

  body { background: var(--c-bg); color: var(--c-text); min-height: 100vh; transition: background 0.3s, color 0.3s; }

  /* Glass header */
  .glass {
    background: var(--c-glass);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--c-glass-b);
  }

  /* Cards */
  .card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 16px; transition: background 0.3s, border-color 0.3s; }
  .card-hover { transition: all 0.2s; }
  .card-hover:hover { border-color: #7c3aed88; background: var(--c-surface2); transform: translateY(-1px); box-shadow: 0 0 24px rgba(124,58,237,0.10); }

  /* Gradient */
  .grad-text { background: linear-gradient(135deg, #a78bfa, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .grad-btn { background: linear-gradient(135deg, #7c3aed, #6366f1); color: white; }
  .grad-btn:hover { background: linear-gradient(135deg, #6d28d9, #4f46e5); }
  .glow-violet { box-shadow: 0 0 32px rgba(124,58,237,0.25); }

  /* Wizard option cards */
  .step-option { background: var(--c-surface); border: 2px solid var(--c-border); border-radius: 14px; cursor: pointer; transition: all 0.2s; }
  .step-option:hover { border-color: #7c3aed55; background: var(--c-surface2); }
  .step-option.selected { border-color: #7c3aed; background: var(--c-surface3); box-shadow: 0 0 20px rgba(124,58,237,0.15); }

  /* Range slider */
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:4px; background: var(--c-border); outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%; background:linear-gradient(135deg,#7c3aed,#6366f1); cursor:pointer; box-shadow:0 0 12px rgba(124,58,237,0.5); }
  input[type=range]::-moz-range-thumb { width:22px; height:22px; border-radius:50%; background:linear-gradient(135deg,#7c3aed,#6366f1); cursor:pointer; border:none; box-shadow:0 0 12px rgba(124,58,237,0.5); }

  /* Animations */
  .step-enter { animation: stepIn 0.35s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes stepIn { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }
  [dir="rtl"] .step-enter { animation: stepInRTL 0.35s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes stepInRTL { from { opacity:0; transform:translateX(-30px); } to { opacity:1; transform:translateX(0); } }
  .count-up { animation: countUp 0.6s cubic-bezier(0.16,1,0.3,1) both; }
  @keyframes countUp { from { opacity:0; transform:translateY(16px) scale(0.9); } to { opacity:1; transform:translateY(0) scale(1); } }
  .result-row { animation: fadeIn 0.4s ease both; }
  @keyframes fadeIn { from { opacity:0; transform:translateX(10px); } to { opacity:1; transform:translateX(0); } }
  [dir="rtl"] .result-row { animation: fadeInRTL 0.4s ease both; }
  @keyframes fadeInRTL { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }
  .theme-btn { transition: transform 0.4s ease; }
  .theme-btn:hover { transform: rotate(20deg); }

  /* Scrollbar */
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background: var(--c-bg); }
  ::-webkit-scrollbar-thumb { background: var(--c-border); border-radius:4px; }

  /* Input */
  .input-field { background: var(--c-surface2); border: 1px solid var(--c-border); color: var(--c-text); border-radius:12px; padding:14px 18px; width:100%; font-size:16px; transition: border 0.2s, background 0.3s; outline:none; }
  .input-field:focus { border-color:#7c3aed; box-shadow:0 0 0 3px rgba(124,58,237,0.15); }
  .input-field::placeholder { color: var(--c-faint); }
  select.input-field option { background: var(--c-surface); color: var(--c-text); }

  /* Nav tab */
  .nav-tab { padding:8px 16px; border-radius:10px; font-size:13px; font-weight:500; cursor:pointer; transition:all 0.2s; color: var(--c-muted); white-space:nowrap; }
  .nav-tab:hover { color:#a78bfa; background:rgba(124,58,237,0.08); }
  .nav-tab.active { color:#a78bfa; background:rgba(124,58,237,0.15); }

  /* Badge */
  .badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }

  /* Progress bar */
  .progress-step { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; transition:all 0.3s; }
  .progress-step.done { background:linear-gradient(135deg,#7c3aed,#6366f1); color:white; }
  .progress-step.current { background:linear-gradient(135deg,#7c3aed,#6366f1); color:white; box-shadow:0 0 18px rgba(124,58,237,0.5); }
  .progress-step.pending { background: var(--c-surface3); color: var(--c-faint); border: 2px solid var(--c-border); }
  .progress-line { flex:1; height:2px; transition:background 0.4s; }

  /* Text helpers using variables */
  .tx-main  { color: var(--c-text); }
  .tx-muted { color: var(--c-muted); }
  .tx-faint { color: var(--c-faint); }
  .bg-s2    { background: var(--c-surface2); }
  .bg-s3    { background: var(--c-surface3); }
  .bd       { border-color: var(--c-border); }

  /* Tailwind overrides for light mode */
  .light .text-white    { color: var(--c-text) !important; }
  .light .text-slate-300 { color: var(--c-text) !important; }
  .light .text-slate-400 { color: var(--c-muted) !important; }
  .light .text-slate-500 { color: var(--c-muted) !important; }
  .light .text-slate-600 { color: var(--c-faint) !important; }
  .light .border-dark-border { border-color: var(--c-border) !important; }
  .light .divide-dark-border > * { border-color: var(--c-border) !important; }
  .light .bg-dark-700 { background: var(--c-surface2) !important; }
  .light .bg-dark-600 { background: var(--c-surface3) !important; }
  .light .bg-dark-800 { background: var(--c-surface2) !important; }
  .light .h-px { background: var(--c-border) !important; }
  .light .w-0\.5 { background: var(--c-border) !important; }

  /* Masqué à l'écran, visible à l'impression */
  .no-screen { display: none !important; }
  @media print { .no-screen { display: flex !important; } }

  /* ════════════════════════════════
     IMPRESSION — CSS COMPLET
     Force fond blanc + texte noir
     quel que soit le mode actif
  ════════════════════════════════ */
  @media print {

    /* 1 — Reset variables → blanc/noir */
    *, *::before, *::after {
      --c-bg:       #ffffff !important;
      --c-surface:  #ffffff !important;
      --c-surface2: #f5f5f8 !important;
      --c-surface3: #ebebf0 !important;
      --c-border:   #ccccdd !important;
      --c-text:     #111122 !important;
      --c-muted:    #444455 !important;
      --c-faint:    #777788 !important;
    }

    /* 2 — Body & fond */
    html, body {
      background: #ffffff !important;
      color: #111122 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* 3 — Masquer éléments non imprimables */
    .no-print,
    header,
    footer,
    button { display: none !important; }

    /* 4 — Gérer Alpine x-show pour l'impression
       Alpine pose display:none en inline style — on override avec !important */

    /* Forcer l'affichage du tab calculateur */
    [x-show="activeTab==='calc'"] { display: block !important; }

    /* Masquer les autres tabs */
    [x-show="activeTab==='procedure'"],
    [x-show="activeTab==='types'"],
    [x-show="activeTab==='refs'"] { display: none !important; }

    /* Masquer les étapes wizard 1-4 et le barème */
    [x-show="wizardStep===1"],
    [x-show="wizardStep===2"],
    [x-show="wizardStep===3"],
    [x-show="wizardStep===4"],
    [x-show="wizardStep < 5"] { display: none !important; }

    /* Forcer l'affichage du step 5 résultats */
    [x-show="wizardStep===5 && results"] { display: block !important; }

    /* Forcer l'affichage du bloc résultats normaux (non faute grave) */
    [x-show="form.type!=='faute_grave'"] { display: block !important; }

    /* Afficher la card D&I si dommages > 0 */
    [x-show="results && results.dommages > 0"] { display: block !important; }

    /* Masquer le bloc faute grave */
    [x-show="form.type==='faute_grave'"] { display: none !important; }

    main { padding: 0 !important; }

    /* 5 — Cards : blanc avec bordure grise */
    .card {
      background: #ffffff !important;
      border: 1px solid #ccccdd !important;
      box-shadow: none !important;
      border-radius: 8px !important;
      page-break-inside: avoid;
    }

    /* 6 — Texte : classes custom */
    .tx-main  { color: #111122 !important; }
    .tx-muted { color: #444455 !important; }
    .tx-faint { color: #777788 !important; }
    .bg-s2    { background: #f5f5f8 !important; }
    .bg-s3    { background: #ebebf0 !important; }

    /* 7 — Gradient text → violet foncé solide */
    .grad-text {
      background: none !important;
      -webkit-background-clip: unset !important;
      -webkit-text-fill-color: #4f46e5 !important;
      background-clip: unset !important;
      color: #4f46e5 !important;
      font-size: 36pt !important;
      font-weight: 800 !important;
    }

    /* 8 — Couleurs des montants */
    .text-violet-500, [class*="text-violet"] { color: #4f46e5 !important; }
    .text-blue-500,   [class*="text-blue"]   { color: #1d4ed8 !important; }
    .text-red-500,    [class*="text-red"]    { color: #b91c1c !important; }
    .text-emerald-500 { color: #047857 !important; }
    .text-amber-400   { color: #92400e !important; }

    /* 9 — Badges imprimables */
    .badge {
      border: 1px solid currentColor !important;
      background: transparent !important;
    }

    /* 10 — Supprimer glows et ombres */
    .glow-violet, [class*="glow"] { box-shadow: none !important; }
    * { text-shadow: none !important; animation: none !important; }

    /* 11 — En-tête d'impression (visible uniquement à l'impression) */
    .print-header {
      display: flex !important;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #4f46e5;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }
    .print-header h1 { font-size: 16pt; font-weight: 700; color: #111122; }
    .print-header p  { font-size: 9pt; color: #777788; margin-top: 2px; }
    .print-header .print-date { font-size: 9pt; color: #777788; text-align: end; }

    /* 12 — Total card bien visible */
    [style*="border-color:rgba(124,58,237"] {
      border: 2px solid #4f46e5 !important;
      background: #f5f4ff !important;
    }

    /* 13 — Breakdown bg */
    [class*="rounded-xl"][class*="bg-s2"] {
      background: #f5f5f8 !important;
      border: 1px solid #e0e0ee !important;
    }

    /* 14 — Warning amber box */
    [style*="rgba(245,158,11"] {
      background: #fffbeb !important;
      border: 1px solid #fbbf24 !important;
    }
  }
</style>
</head>
<body>

<!-- EN-TÊTE PRINT ONLY (masqué à l'écran, visible à l'impression) -->
<div class="print-header no-screen" style="display:none">
  <div>
    <h1>⚖️ Moulinette Licenciement — Maroc</h1>
    <p>Code du Travail Marocain — Loi 65-99</p>
  </div>
  <div class="print-date">
    <p>Imprimé le <span id="print-date"></span></p>
    <p style="font-style:italic;margin-top:4px">Document à titre indicatif</p>
  </div>
</div>
<script>document.getElementById('print-date').textContent = new Date().toLocaleDateString('fr-MA');</script>

<!-- ═══ HEADER ═══ -->
<header class="glass sticky top-0 z-50 no-print">
  <div class="max-w-6xl mx-auto px-5 py-4">
    <div class="flex items-center justify-between gap-4">

      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl grad-btn flex items-center justify-center text-lg glow-violet flex-shrink-0">⚖️</div>
        <div>
          <h1 class="text-sm font-bold tx-main leading-tight" x-text="t('app_title')"></h1>
          <p class="text-xs tx-muted" x-text="t('app_sub')"></p>
        </div>
      </div>

      <!-- Right controls -->
      <div class="flex items-center gap-2">

        <!-- Theme toggle -->
        <button @click="darkMode = !darkMode"
          class="theme-btn w-9 h-9 rounded-xl flex items-center justify-center text-lg bd border"
          style="background: var(--c-surface2)"
          :title="darkMode ? 'Mode clair' : 'Mode sombre'">
          <span x-text="darkMode ? '☀️' : '🌙'"></span>
        </button>

        <!-- Language pills -->
        <div class="flex gap-1 rounded-xl p-1 bd border" style="background: var(--c-surface2)">
          <button @click="setLang('fr')"
            :class="lang==='fr' ? 'bg-violet-600 text-white shadow' : 'tx-muted hover:text-white'"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">FR</button>
          <button @click="setLang('ar')"
            :class="lang==='ar' ? 'bg-violet-600 text-white shadow' : 'tx-muted hover:text-white'"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">عربية</button>
        </div>
      </div>
    </div>

    <!-- Nav tabs -->
    <div class="flex gap-1 mt-3 overflow-x-auto pb-0.5">
      <template x-for="tab in tabs" :key="tab.id">
        <button @click="activeTab=tab.id; wizardStep=1"
          :class="activeTab===tab.id ? 'active' : ''"
          class="nav-tab flex items-center gap-1.5">
          <span x-text="tab.icon"></span>
          <span x-text="t(tab.labelKey)"></span>
        </button>
      </template>
    </div>
  </div>
</header>

<!-- ═══ MAIN ═══ -->
<main class="max-w-6xl mx-auto px-5 py-10">

<!-- ══════════════════════════════════════════
     TAB: CALCULATEUR — WIZARD
══════════════════════════════════════════ -->
<div x-show="activeTab==='calc'" x-cloak>

  <div class="text-center mb-10">
    <h2 class="text-3xl font-bold tx-main mb-2" x-text="t('calc_title')"></h2>
    <p class="tx-muted" x-text="t('calc_sub')"></p>
  </div>

  <!-- Progress -->
  <div class="flex items-center justify-center mb-10 max-w-sm mx-auto">
    <template x-for="n in [1,2,3,4]" :key="n">
      <div class="flex items-center" :class="n < 4 ? 'flex-1' : ''">
        <div class="progress-step" :class="wizardStep > n ? 'done' : wizardStep === n ? 'current' : 'pending'">
          <span x-show="wizardStep > n">✓</span>
          <span x-show="wizardStep <= n" x-text="n"></span>
        </div>
        <div x-show="n < 4" class="progress-line"
          :style="wizardStep > n ? 'background:linear-gradient(90deg,#7c3aed,#6366f1)' : 'background:var(--c-border)'"></div>
      </div>
    </template>
  </div>

  <!-- STEP 1 — Type -->
  <div x-show="wizardStep===1" class="step-enter">
    <h3 class="text-xl font-semibold tx-main mb-2 text-center" x-text="t('step1_title')"></h3>
    <p class="tx-muted text-center text-sm mb-8" x-text="t('step1_sub')"></p>
    <div class="grid sm:grid-cols-2 gap-4 max-w-2xl mx-auto">
      <template x-for="opt in dismissalOptions()" :key="opt.value">
        <button @click="form.type=opt.value; nextStep()" :class="form.type===opt.value ? 'selected' : ''" class="step-option p-5 text-start w-full">
          <div class="flex items-start gap-4">
            <span class="text-3xl flex-shrink-0" x-text="opt.icon"></span>
            <div>
              <p class="font-semibold tx-main mb-1" x-text="opt.label"></p>
              <p class="text-xs tx-muted leading-relaxed" x-text="opt.desc"></p>
            </div>
          </div>
          <div class="mt-3"><span class="badge" :class="opt.badgeClass" x-text="opt.badge"></span></div>
        </button>
      </template>
    </div>
  </div>

  <!-- STEP 2 — Catégorie -->
  <div x-show="wizardStep===2" class="step-enter">
    <h3 class="text-xl font-semibold tx-main mb-2 text-center" x-text="t('step2_title')"></h3>
    <p class="tx-muted text-center text-sm mb-8" x-text="t('step2_sub')"></p>
    <div class="grid sm:grid-cols-3 gap-4 max-w-2xl mx-auto">
      <template x-for="opt in categoryOptions()" :key="opt.value">
        <button @click="form.category=opt.value; nextStep()" :class="form.category===opt.value ? 'selected' : ''" class="step-option p-6 text-center w-full">
          <span class="text-4xl mb-3 block" x-text="opt.icon"></span>
          <p class="font-semibold tx-main mb-1" x-text="opt.label"></p>
          <p class="text-xs tx-muted" x-text="opt.desc"></p>
        </button>
      </template>
    </div>
    <div class="flex justify-center mt-6">
      <button @click="prevStep()" class="tx-muted hover:text-violet-400 text-sm flex items-center gap-2 transition-colors">
        <span x-text="lang==='ar' ? '→' : '←'"></span><span x-text="t('back')"></span>
      </button>
    </div>
  </div>

  <!-- STEP 3 — Ancienneté -->
  <div x-show="wizardStep===3" class="step-enter">
    <h3 class="text-xl font-semibold tx-main mb-2 text-center" x-text="t('step3_title')"></h3>
    <p class="tx-muted text-center text-sm mb-8" x-text="t('step3_sub')"></p>
    <div class="max-w-lg mx-auto">

      <!-- Date d'embauche (calcul auto) -->
      <div class="rounded-xl p-4 mb-4" style="background:rgba(124,58,237,0.07); border:1px solid rgba(124,58,237,0.2)">
        <label class="block text-xs font-semibold text-violet-400 mb-2" x-text="t('hire_date_label')"></label>
        <input type="date" x-model="form.hireDate"
          @change="updateSeniorityFromDate()"
          :max="new Date().toISOString().split('T')[0]"
          class="input-field text-sm">
        <div x-show="form.hireDate" class="flex items-center justify-between mt-2">
          <p class="text-sm font-semibold text-violet-400">
            <span x-text="t('hire_date_calculated')"></span>
            <span x-text="hireDateLabel()"></span>
          </p>
          <button @click="form.hireDate = ''" class="text-xs tx-faint hover:text-red-400 transition-colors" x-text="t('hire_date_clear')"></button>
        </div>
      </div>

      <div class="card p-8">
        <div class="text-center mb-8">
          <div class="text-7xl font-bold grad-text" x-text="form.seniority"></div>
          <div class="tx-muted mt-2 text-sm" x-text="t('years_label')"></div>
        </div>
        <input type="range" min="1" max="40" x-model.number="form.seniority" @input="form.hireDate = ''" class="mb-6">
        <div class="flex justify-between text-xs tx-faint mb-6">
          <span>1 <span x-text="t('year_short')"></span></span>
          <span>20</span><span>40</span>
        </div>
        <input type="number" min="1" max="50" x-model.number="form.seniority" @input="form.hireDate = ''" class="input-field text-center text-lg font-semibold" :placeholder="t('seniority_placeholder')">
      </div>
      <div class="flex justify-between mt-6">
        <button @click="prevStep()" class="tx-muted hover:text-violet-400 text-sm flex items-center gap-2 transition-colors">
          <span x-text="lang==='ar' ? '→' : '←'"></span><span x-text="t('back')"></span>
        </button>
        <button @click="nextStep()" :disabled="!form.seniority || form.seniority < 1"
          class="grad-btn font-semibold px-6 py-2.5 rounded-xl transition-all disabled:opacity-40 disabled:cursor-not-allowed">
          <span x-text="t('next')"></span> <span x-text="lang==='ar' ? '←' : '→'"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- STEP 4 — Salaire -->
  <div x-show="wizardStep===4" class="step-enter">
    <h3 class="text-xl font-semibold tx-main mb-2 text-center" x-text="t('step4_title')"></h3>
    <p class="tx-muted text-center text-sm mb-8" x-text="t('step4_sub')"></p>
    <div class="max-w-lg mx-auto">
      <div class="card p-8">
        <div class="text-center mb-6">
          <div class="text-5xl font-bold tx-main mb-1">
            <span x-text="form.salary ? fmt(form.salary) : '—'"></span>
            <span class="text-2xl tx-muted ms-1">MAD</span>
          </div>
          <div class="text-xs tx-muted mt-2">
            <span x-text="t('equiv_hourly')"></span>
            <span class="text-violet-500 font-semibold ms-1" x-text="form.salary ? fmt(form.salary/191)+' MAD/h' : '—'"></span>
          </div>
        </div>
        <div class="relative">
          <input type="number" x-model.number="form.salary" min="0" class="input-field text-center text-xl font-semibold" :placeholder="t('salary_placeholder')">
          <span class="absolute end-4 top-1/2 -translate-y-1/2 tx-faint text-sm font-medium">MAD</span>
        </div>
        <p class="mt-4 text-center text-xs tx-faint" x-text="t('smig_ref')"></p>
      </div>
      <div class="flex justify-between mt-6">
        <button @click="prevStep()" class="tx-muted hover:text-violet-400 text-sm flex items-center gap-2 transition-colors">
          <span x-text="lang==='ar' ? '→' : '←'"></span><span x-text="t('back')"></span>
        </button>
        <button @click="calculateAndNext()" :disabled="!form.salary || form.salary < 1"
          class="grad-btn glow-violet font-semibold px-8 py-3 rounded-xl transition-all disabled:opacity-40 disabled:cursor-not-allowed text-base">
          <span x-text="t('calculate')"></span> ✨
        </button>
      </div>
    </div>
  </div>

  <!-- STEP 5 — Résultats -->
  <div x-show="wizardStep===5 && results" class="step-enter">

    <!-- Faute grave -->
    <div x-show="form.type==='faute_grave'" class="max-w-2xl mx-auto">
      <div class="card p-8 text-center" style="border-color:rgba(239,68,68,0.3)">
        <div class="text-5xl mb-4">🚨</div>
        <h3 class="text-xl font-bold text-red-400 mb-3" x-text="t('faute_grave_warning_title')"></h3>
        <p class="tx-muted text-sm leading-relaxed mb-4" x-text="t('faute_grave_warning')"></p>
        <p class="text-xs tx-faint bg-s2 rounded-lg px-4 py-2 inline-block" x-text="t('faute_grave_ref')"></p>
      </div>
      <button @click="wizardStep=1; results=null" class="mt-6 w-full text-center tx-muted hover:text-violet-400 text-sm transition-colors" x-text="t('restart')"></button>
    </div>

    <!-- Résultats normaux -->
    <div x-show="form.type!=='faute_grave'" class="max-w-2xl mx-auto">

      <div class="card p-8 mb-5 text-center glow-violet" style="border-color:rgba(124,58,237,0.3)">
        <p class="tx-muted text-sm mb-3" x-text="t('total')"></p>
        <div class="count-up">
          <span class="text-5xl font-bold grad-text" x-text="results ? fmt(results.total)+' MAD' : ''"></span>
        </div>
        <div class="flex justify-center gap-3 mt-4 flex-wrap">
          <span class="badge bg-violet-500/15 text-violet-500" x-text="t('label_'+form.type)"></span>
          <span class="badge" style="background:var(--c-surface3); color:var(--c-muted)" x-text="t(form.category)"></span>
          <span class="badge" style="background:var(--c-surface3); color:var(--c-muted)" x-text="results ? results.seniorityLabel : ''"></span>
        </div>
      </div>

      <div class="space-y-3 mb-5">

        <div class="card p-5 result-row" style="animation-delay:0.1s">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm" style="background:rgba(124,58,237,0.12)">📋</div>
              <span class="font-medium tx-main text-sm" x-text="t('legal_indemnity')"></span>
            </div>
            <span class="font-bold text-violet-500" x-text="results ? fmt(results.indemniteLegale)+' MAD' : ''"></span>
          </div>
          <div class="rounded-xl px-4 py-3 bg-s2">
            <!-- Taux horaire -->
            <div x-show="results" class="flex items-center gap-2 text-xs pb-2.5 mb-2.5" style="border-bottom:1px solid var(--c-border)">
              <span class="text-violet-400 font-semibold" x-text="t('calc_hourly_rate') + ' :'"></span>
              <span class="tx-faint font-mono" x-text="results ? results.salaireHoraireFormula : ''"></span>
            </div>
            <!-- Tranches avec formule -->
            <template x-if="results">
              <div class="space-y-2.5">
                <template x-for="line in results.breakdown" :key="line.label">
                  <div>
                    <div class="flex justify-between text-xs">
                      <span class="tx-muted font-semibold" x-text="line.label"></span>
                      <span class="text-violet-500 font-bold" x-text="fmt(line.amount)+' MAD'"></span>
                    </div>
                    <div class="text-xs tx-faint mt-0.5 font-mono opacity-80" x-text="line.formula"></div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>

        <div class="card p-5 result-row" style="animation-delay:0.2s">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm" style="background:rgba(59,130,246,0.12)">📅</div>
              <div>
                <span class="font-medium tx-main text-sm" x-text="t('notice_indemnity')"></span>
                <p class="text-xs tx-faint mt-0.5" x-text="results ? results.preavislabel : ''"></p>
                <p class="text-xs font-mono mt-1 opacity-75" style="color:var(--c-faint)" x-text="results ? results.preFormula : ''"></p>
              </div>
            </div>
            <span class="font-bold text-blue-500" x-text="results ? fmt(results.indemnitePreavis)+' MAD' : ''"></span>
          </div>
        </div>

        <div x-show="results && results.dommages > 0" class="card p-5 result-row" style="animation-delay:0.3s">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm" style="background:rgba(239,68,68,0.12)">⚖️</div>
              <div>
                <span class="font-medium tx-main text-sm" x-text="t('damages')"></span>
                <p class="text-xs tx-faint mt-0.5" x-text="t('damages_ref')"></p>
                <p class="text-xs font-mono mt-1 opacity-75" style="color:var(--c-faint)" x-text="results ? results.domFormula : ''"></p>
              </div>
            </div>
            <span class="font-bold text-red-500" x-text="results ? fmt(results.dommages)+' MAD' : ''"></span>
          </div>
        </div>

      </div>

      <div class="rounded-xl px-5 py-3 mb-5" style="background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.2)">
        <p class="text-xs leading-relaxed" style="color:rgba(217,119,6,0.9)" x-text="t('disclaimer')"></p>
      </div>

      <!-- Actions : Restart / Share / Print -->
      <div class="flex gap-3 flex-wrap">
        <button @click="wizardStep=1; results=null" class="flex-1 font-medium py-3 rounded-xl transition-colors text-sm tx-muted card-hover card" x-text="t('restart')"></button>

        <!-- ② Partage URL -->
        <button @click="shareUrl()" class="flex-1 font-medium py-3 rounded-xl text-sm transition-all no-print"
          :class="copiedUrl ? 'bg-emerald-600 text-white' : ''"
          :style="!copiedUrl ? 'background:var(--c-surface2); color:var(--c-muted); border:1px solid var(--c-border)' : ''">
          <span x-text="copiedUrl ? t('share_copied') : t('share_btn')"></span>
        </button>

        <button @click="window.print()" class="flex-1 grad-btn font-medium py-3 rounded-xl text-sm no-print">
          🖨️ <span x-text="t('print')"></span>
        </button>
      </div>

      <!-- ① Historique -->
      <div x-show="history.length > 0" class="mt-4 no-print">
        <button @click="showHistory = !showHistory"
          class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-sm tx-muted transition-colors"
          style="background:var(--c-surface2); border:1px solid var(--c-border)">
          <span x-text="t('history_title')"></span>
          <span class="transition-transform" :class="showHistory ? 'rotate-180' : ''" style="display:inline-block">▾</span>
        </button>

        <div x-show="showHistory" class="mt-2 space-y-2">
          <template x-for="entry in history" :key="entry.id">
            <div class="card p-3 flex items-center justify-between gap-3 card-hover">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1 flex-wrap">
                  <span class="text-xs tx-faint" x-text="entry.date"></span>
                  <span class="badge bg-violet-500/10 text-violet-400 text-xs" x-text="t('label_'+entry.type)"></span>
                  <span class="badge text-xs" style="background:var(--c-surface3);color:var(--c-muted)" x-text="t(entry.category)"></span>
                  <span class="badge text-xs" style="background:var(--c-surface3);color:var(--c-muted)" x-text="entry.seniority + (lang==='ar' ? ' سنة' : ' ans')"></span>
                </div>
                <p class="text-sm font-bold text-violet-400" x-text="fmt(entry.total) + ' MAD'"></p>
              </div>
              <button @click="restoreFromHistory(entry)"
                class="flex-shrink-0 text-xs grad-btn px-3 py-1.5 rounded-lg font-medium"
                x-text="t('history_restore')">
              </button>
            </div>
          </template>
          <button @click="clearHistory()" class="w-full text-xs tx-faint hover:text-red-400 transition-colors py-1" x-text="t('history_clear')"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Barème (visible avant résultats) -->
  <div class="mt-16" x-show="wizardStep < 5">
    <h4 class="text-xs font-semibold tx-faint uppercase tracking-widest mb-4 text-center" x-text="t('bareme_title')"></h4>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-2xl mx-auto">
      <template x-for="row in baremeRows()" :key="row.years">
        <div class="card p-4 text-center card-hover">
          <p class="text-xs tx-faint mb-1" x-text="row.years"></p>
          <p class="text-lg font-bold text-violet-500" x-text="row.rate"></p>
          <p class="text-xs tx-faint mt-0.5">Art. 52</p>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     TAB: DATES LÉGALES ③
══════════════════════════════════════════ -->
<div x-show="activeTab==='dates'" x-cloak>

  <div class="text-center mb-10">
    <h2 class="text-3xl font-bold tx-main mb-2" x-text="t('dates_title')"></h2>
    <p class="tx-muted" x-text="t('dates_sub')"></p>
  </div>

  <div class="max-w-2xl mx-auto">

    <!-- Formulaire -->
    <div class="card p-8 mb-6">
      <div class="space-y-5">

        <!-- Date de notification -->
        <div>
          <label class="block text-sm font-medium tx-main mb-2" x-text="t('dates_notif_label')"></label>
          <input type="date" x-model="dateForm.notifDate" class="input-field">
        </div>

        <!-- Type de licenciement -->
        <div>
          <label class="block text-sm font-medium tx-main mb-2" x-text="t('dates_type_label')"></label>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <template x-for="opt in dismissalOptions()" :key="opt.value">
              <button @click="dateForm.type = opt.value"
                :class="dateForm.type === opt.value ? 'selected' : ''"
                class="step-option p-3 text-center">
                <span class="text-xl block mb-1" x-text="opt.icon"></span>
                <span class="text-xs tx-main font-medium leading-tight" x-text="opt.label"></span>
              </button>
            </template>
          </div>
        </div>

        <!-- Catégorie -->
        <div>
          <label class="block text-sm font-medium tx-main mb-2" x-text="t('dates_category_label')"></label>
          <div class="grid grid-cols-3 gap-3">
            <template x-for="opt in categoryOptions()" :key="opt.value">
              <button @click="dateForm.category = opt.value"
                :class="dateForm.category === opt.value ? 'selected' : ''"
                class="step-option p-4 text-center">
                <span class="text-2xl block mb-1" x-text="opt.icon"></span>
                <span class="text-xs tx-main font-medium" x-text="opt.label"></span>
              </button>
            </template>
          </div>
        </div>

        <!-- Ancienneté -->
        <div x-show="dateForm.type !== 'faute_grave'">
          <label class="block text-sm font-medium tx-main mb-2">
            <span x-text="t('dates_seniority_label')"></span>
            <span class="text-violet-400 font-bold ms-2" x-text="dateForm.seniority"></span>
          </label>
          <input type="range" min="1" max="40" x-model.number="dateForm.seniority">
        </div>

        <!-- Bouton calculer -->
        <button @click="calculateDates()"
          :disabled="!dateForm.notifDate || !dateForm.category"
          class="grad-btn glow-violet w-full py-3.5 rounded-xl font-semibold transition-all disabled:opacity-40 disabled:cursor-not-allowed">
          📅 <span x-text="t('dates_calculate')"></span>
        </button>
      </div>
    </div>

    <!-- Timeline résultats -->
    <div x-show="dateResults" class="space-y-3">
      <h3 class="text-sm font-semibold tx-faint uppercase tracking-widest text-center mb-4" x-text="t('dates_timeline_title')"></h3>

      <template x-if="dateResults">
        <div class="space-y-3">
          <template x-for="(step, i) in dateResults.steps" :key="i">
            <div class="card p-5 flex items-start gap-4"
              :style="step.highlight ? 'border-color:rgba(124,58,237,0.35); background:var(--c-surface2)' : ''">

              <!-- Icône + ligne verticale -->
              <div class="flex flex-col items-center flex-shrink-0">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg"
                  :style="step.highlight ? 'background:rgba(124,58,237,0.15)' : 'background:var(--c-surface3)'">
                  <span x-text="step.icon"></span>
                </div>
                <div x-show="i < dateResults.steps.length - 1" class="w-0.5 flex-1 mt-2 min-h-4" style="background:var(--c-border)"></div>
              </div>

              <!-- Contenu -->
              <div class="flex-1 min-w-0 pb-2">
                <p class="text-sm font-medium tx-main mb-1" x-text="step.label"></p>
                <p class="text-base font-bold tx-main" x-text="step.date"></p>
                <div x-show="step.badge" class="mt-2">
                  <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-semibold border"
                    :class="step.badge ? step.badge.cls : ''"
                    x-text="step.badge ? step.badge.text : ''">
                  </span>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>

      <p class="text-xs tx-faint text-center mt-4">⚠️ <span x-text="t('disclaimer').replace('⚠️ ','')"></span></p>

      <button @click="dateResults = null; dateForm.notifDate = ''; dateForm.category = null"
        class="w-full text-center text-xs tx-faint hover:text-violet-400 transition-colors py-2"
        x-text="t('dates_reset')">
      </button>
    </div>

  </div>
</div>

</main>

<!-- Footer -->
<footer class="mt-16 py-6 no-print" style="border-top:1px solid var(--c-border)">
  <div class="max-w-6xl mx-auto px-5 text-center">
    <p class="text-xs tx-faint" x-text="t('footer')"></p>
  </div>
</footer>

<script src="app.js?v=6"></script>
</body>
</html>
